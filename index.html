<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despiece · Mestizo</title>
<style>
:root {
  --bg: #1A1A1A; --card: #242320; --card2: #1F1E1A; --borde: #3A362E; --borde2: #423E33;
  --txt: #F4F1EA; --txt2: #F0EDE4; --mute: #A39D87; --mute2: #8C8672;
  --verde: #8C9278; --salvia: #7C8268; --madera: #B98A55; --crema: #F0DEC0; --marron: #2E2418;
  --ok: #8FBF7A; --warn: #D9A55C; --err: #E08B6B; --errbg: #3A2620;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Suisse Intl', 'Poppins', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--txt); margin: 0; font-size: 14px;
}
.app { max-width: 1180px; margin: 0 auto; padding: 16px 16px 80px; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.logo { height: 64px; width: 64px; border-radius: 12px; }
.titulo { flex: 1; min-width: 180px; }
.titulo h1 { font-size: 18px; margin: 0; font-weight: 600; color: #F8F6F0; letter-spacing: -.2px; }
.titulo .sub { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; margin-top: 2px; }
.estado { font-size: 12px; color: var(--mute2); }
.estado.ok { color: var(--ok); } .estado.err { color: var(--err); } .estado.warn { color: var(--warn); }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

button, .btn {
  font-family: inherit; border: none; border-radius: 999px; background: var(--verde); color: #181812;
  font-size: 13px; font-weight: 600; padding: 8px 16px; cursor: pointer; letter-spacing: .2px; white-space: nowrap;
}
button:hover { filter: brightness(1.08); }
button:disabled { background: #46443B; color: var(--mute2); cursor: default; filter: none; }
button.sec { background: transparent; color: var(--crema); border: 1px solid var(--borde2); }
button.peligro { background: var(--errbg); color: var(--err); }
button.mini { padding: 4px 10px; font-size: 12px; }
button.ico { padding: 4px 9px; font-size: 13px; line-height: 1; }

nav.tabs { display: flex; gap: 6px 8px; flex-wrap: wrap; margin: 0 0 16px; font-size: 13px; border-bottom: 1px solid var(--borde); padding-bottom: 12px; }
nav.tabs a { color: #A9B08F; text-decoration: none; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; user-select: none; }
nav.tabs a.activa { color: var(--crema); background: var(--marron); border-color: var(--madera); }
nav.tabs a .n { color: var(--mute2); font-weight: 400; margin-left: 4px; }

.card { background: var(--card); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 15px; color: var(--crema); }
.hint { font-size: 12px; color: var(--mute2); margin: 2px 0 12px; line-height: 1.45; }
label.l { display: block; font-size: 11px; color: var(--mute); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
select, input, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--borde2); border-radius: 10px; font-size: 13px; font-family: inherit;
  background: var(--card2); color: var(--txt2);
}
input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--verde); }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--madera); border-color: var(--madera); }
input:disabled, select:disabled { opacity: .45; }
textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 14px; }
.campo { margin-bottom: 4px; }

.tabla-wrap { overflow-x: auto; border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; padding: 6px 6px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; font-size: 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; position: sticky; top: 0; background: var(--card); }
table.t td { padding: 4px 4px; border-top: 1px solid var(--borde); color: var(--txt2); vertical-align: middle; }
table.t td input, table.t td select { padding: 6px 7px; font-size: 12.5px; border-radius: 8px; min-width: 56px; }
table.t td select { min-width: 118px; }
table.tabla-corte th.n { text-align: center; }
table.t td.num input { width: 74px; text-align: right; }
table.t td.chk { text-align: center; }
table.t td.ro { padding: 4px 8px; font-weight: 700; color: var(--crema); white-space: nowrap; }
table.t tr.fila-aviso td { background: rgba(217,165,92,.07); }
table.t td.acc { white-space: nowrap; text-align: right; }
.vacio { color: var(--mute2); font-size: 13px; padding: 14px 4px; text-align: center; }
.barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

.avisos { background: var(--card2); border: 1px solid var(--borde); border-left: 3px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--warn); }
.avisos summary { cursor: pointer; font-weight: 600; }
.avisos ul { margin: 8px 0 0; padding-left: 18px; color: var(--txt2); } .avisos li { margin-bottom: 4px; }
.avisos.error { border-left-color: var(--err); color: var(--err); }
.pie { font-size: 11px; color: var(--mute2); margin-top: 8px; }

.sugerencias { position: absolute; z-index: 50; background: #2a2823; border: 1px solid var(--madera); border-radius: 10px; max-height: 260px; overflow-y: auto; min-width: 320px; max-width: 520px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.sugerencias div { padding: 7px 10px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid var(--borde); }
.sugerencias div:hover, .sugerencias div.sel { background: var(--marron); color: var(--crema); }
.sugerencias div small { color: var(--mute2); }

.modulo-card { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.modulo-titulo { font-weight: 600; font-size: 14px; color: var(--crema); margin-bottom: 2px; }
.modulo-sub { font-size: 11.5px; color: var(--mute2); margin-bottom: 10px; }
table.tabla-corte { width: 100%; border-collapse: collapse; font-size: 12px; }
table.tabla-corte th { text-align: left; padding: 6px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; font-size: 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
table.tabla-corte td { padding: 6px; border-top: 1px solid var(--borde); color: var(--txt2); white-space: nowrap; }
table.tabla-corte td.mat { color: var(--crema); font-weight: 600; white-space: normal; }
table.tabla-corte td.mat.sin { color: var(--mute2); font-weight: 400; }
table.tabla-corte td.n { text-align: center; }
.pieza-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 12.5px; color: var(--txt2); border-top: 1px solid var(--borde); }
.pieza-row span.q { color: var(--crema); font-weight: 600; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.chip { display: inline-block; font-size: 11px; border: 1px solid var(--borde2); border-radius: 999px; padding: 2px 9px; color: var(--mute); }
.jony-grupo { margin-bottom: 18px; } .jony-grupo-titulo { font-weight: 600; font-size: 13px; color: var(--crema); margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--borde2); border-radius: 999px; overflow: hidden; }
.seg a { padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--mute); cursor: pointer; }
.seg a.on { background: var(--marron); color: var(--crema); }

dialog { background: var(--card); color: var(--txt); border: 1px solid var(--madera); border-radius: 18px; padding: 20px; max-width: min(620px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h3 { margin: 0 0 10px; color: var(--crema); font-size: 16px; }
dialog .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card2); border-radius: 12px; padding: 9px 12px; margin-bottom: 6px; font-size: 13px; }
dialog .fila small { color: var(--mute2); display: block; }
dialog .pie-d { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2a2823; border: 1px solid var(--borde2); color: var(--txt2); padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 100; max-width: 90vw; }
.toast.ok { border-color: var(--ok); } .toast.err { border-color: var(--err); color: var(--err); }

.print-titlebar { display: none; }
.modulo-titulo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.avisos a.ir { color: var(--crema); font-weight: 600; text-decoration: none; margin-left: 6px; white-space: nowrap; }
.avisos a.ir:hover { text-decoration: underline; }
table.t tr.resaltada td { background: rgba(185,138,85,.28); transition: background .4s; }
table.tabla-corte td.chk { text-align: center; width: 34px; }
table.tabla-corte tr.cortada td { text-decoration: line-through; color: var(--mute2); }
table.tabla-corte tr.cortada td.chk { text-decoration: none; }
/* Fichas */
.ficha { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 14px; align-items: start; }
.f-detalle { min-width: 0; }
.f-lista { min-width: 0; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 8px; }
.f-botones { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.f-botones button { width: 100%; }
.f-amb { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; margin-top: 6px; }
.f-mod { border: 1px solid var(--borde); border-radius: 10px; padding: 8px 10px; background: var(--card2); cursor: pointer; }
.f-mod.on { border-color: var(--madera); background: var(--marron); }
.f-mod b { display: block; font-weight: 600; color: var(--crema); font-size: 13px; }
.f-mod span { color: var(--mute); font-size: 12px; }
.f-mod .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
.f-mod .dot.w { background: var(--warn); }
.f-warn { color: var(--warn) !important; }
.fsec { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.fsec h4 { margin: 0 0 8px; font-size: 12px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.fsec summary { cursor: pointer; font-size: 12px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 10px; }
.row-f { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill-f { border: 1px solid var(--verde); color: var(--ok); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
@media (max-width: 720px) { .ficha { grid-template-columns: minmax(0, 1fr); } .f-lista { position: static; } .f-botones { flex-direction: row; flex-wrap: wrap; } .f-botones button { width: auto; } }
@media print { .ficha .f-lista { display: none; } }
/* Tapacantos en la ficha */
.tcard { border: 1px solid var(--borde); border-radius: 12px; background: var(--card2); padding: 10px 12px; margin-bottom: 8px; }
.tcard select, .tcard input { min-width: 0 !important; width: 100%; }
.tc-top { display: grid; grid-template-columns: 1fr 110px auto; gap: 10px; align-items: end; }
.tc-acc { white-space: nowrap; padding-bottom: 4px; }
.tc-lados { display: grid; grid-template-columns: auto repeat(4, minmax(96px, 1fr)); gap: 8px; align-items: end; margin-top: 8px; }
.tc-lados > .l { align-self: center; padding-top: 18px; max-width: 90px; line-height: 1.2; }
.tc-mat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.tc-aviso { margin-top: 8px; font-size: 12px; color: var(--warn); }
@media (max-width: 760px) { .tc-top { grid-template-columns: 1fr 90px; } .tc-acc { grid-column: 1 / -1; } .tc-lados { grid-template-columns: repeat(2, 1fr); } .tc-lados > .l { grid-column: 1 / -1; padding-top: 0; max-width: none; } .tc-mat { grid-template-columns: 1fr; } }
nav.tabs { align-items: center; }
/* Etiquetas */
.etiquetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.etq { background: var(--card); border: 1px dashed var(--borde2); border-radius: 8px; padding: 8px 10px; min-height: 104px; display: flex; flex-direction: column; gap: 2px; break-inside: avoid; }
.etq-id { font-size: 20px; font-weight: 700; color: var(--crema); line-height: 1.1; }
.etq-pz { font-size: 13px; font-weight: 600; }
.etq-med { font-size: 16px; font-weight: 700; color: #fff; }
.etq-mat, .etq-tap { font-size: 11px; color: var(--mute); }
.etq-pie { margin-top: auto; display: flex; justify-content: space-between; font-size: 10px; color: var(--mute2); }
@media (max-width: 640px) { .app { padding: 12px 10px 80px; } .row3 { gap: 6px; } }

/* ------------------------- IMPRESIÓN (vista Taller) ------------------------- */
@media print {
  @page { size: A4; margin: 10mm 10mm 14mm; }
  body { background: #fff; color: #000; font-size: 11px; }
  .app { max-width: none; padding: 0; }
  header.top, nav.tabs, .no-print, .avisos, .toast { display: none !important; }
  .print-titlebar { display: flex !important; justify-content: space-between; align-items: center; background: #666666; padding: 8px 12px; margin-bottom: 10px; font-family: Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-titlebar span { color: #fff; font-size: 13px; }
  .card { background: #fff; border: none; padding: 0; margin: 0; }
  table.tabla-corte, table.t { font-family: Arial, sans-serif; }
  table.tabla-corte th, table.t th { background: #B7B7B7; color: #000; border: 1px solid #999; position: static; }
  table.tabla-corte td, table.t td { border: 1px solid #ccc; color: #000; }
  table.tabla-corte tbody tr:nth-child(even) td { background: #F3F3F3; }
  table.tabla-corte td.mat { color: #000; } table.tabla-corte td.mat.sin { color: #666; }
  .modulo-card { background: #fff; border: none; border-radius: 0; padding: 0; margin-bottom: 14px; page-break-inside: avoid; }
  .modulo-titulo { background: #CCCCCC; color: #000; padding: 6px 10px; font-family: Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .modulo-sub { color: #333; padding: 2px 10px; font-family: Arial, sans-serif; }
  .jony-grupo { page-break-inside: avoid; } .jony-grupo-titulo { color: #000; }
  .pieza-row { background: #EFEFEF; border: 1px solid #ccc; color: #000; padding: 5px 10px; font-family: Arial, sans-serif; }
  .tabla-wrap { overflow: visible; }
  body.solo-impresion main > :not(.imprimir-esto) { display: none !important; }
  .modulo-titulo { display: block; }
  table.tabla-corte tr.cortada td { text-decoration: line-through; color: #777; }
  table.tabla-corte td.chk input { width: 12px; height: 12px; }
  .etiquetas { grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .etq { background: #fff; border: 1px dashed #666; border-radius: 0; height: 36mm; min-height: 0; padding: 2mm 3mm; overflow: hidden; break-inside: avoid; }
  .etq-id { font-size: 16px; color: #000; } .etq-pz { font-size: 11px; color: #000; } .etq-med { font-size: 14px; color: #000; }
  .etq-mat, .etq-tap { font-size: 9px; color: #333; } .etq-pie { font-size: 8px; color: #444; }
}

</style>
</head>

/* =====================================================================
   MOTOR DE DESPIECE — port a JavaScript puro (navegador / Node)

   ---------------------------------------------------------------------
   Port fiel de Despiece.js (Apps Script, v20). Las fórmulas, la cadena
   de resolución de material, el agrupamiento y el reparto de Tapacantos
   son los mismos; lo único que cambia es de dónde salen los datos: en
   vez de leer hojas, generar(d) recibe un objeto `d` (ver DATOS_VACIOS)
   y devuelve las salidas como estructuras de datos (no escribe celdas).

   Si el original y este archivo no coinciden, manda el original

(function (root) {
  'use strict';

  const E = 18;
  const FONDO_CON_PUERTA = 7;
  const FONDO_SIN_PUERTA = 6;
  const H_MIN_CAJON = 100;
  const PUERTA_OFFSETS = { 'Puerta2': -2, 'Puerta18': 18, 'Puerta32': -32 };
  const ESPESORES_FONDO_CAJON = [5, 15];

  function r2(n) { return Math.round(n); }

  const CATALOGO = {
    'Bajos':            { tieneTecho: false, puertaObligatoria: true,  estantesDisponibles: true,  paranteBase: 2, paranteOpcional: true, cajonera: false, esNicho: false, familiaFrente: 'Bajo' },
    'Alacena':          { tieneTecho: true,  puertaObligatoria: true,  estantesDisponibles: true,  paranteBase: 1, paranteOpcional: true, cajonera: false, esNicho: false, familiaFrente: 'Alacena' },
    'Alacena Abatible': { tieneTecho: true,  puertaObligatoria: true,  estantesDisponibles: true,  paranteBase: 1, paranteOpcional: true, cajonera: false, esNicho: false, familiaFrente: 'Alacena' },
    'Nicho Abierto':    { tieneTecho: true,  puertaObligatoria: false, estantesDisponibles: true,  paranteBase: 0, paranteOpcional: true, cajonera: false, esNicho: true,  familiaFrente: 'Alacena' },
    'Columna':          { tieneTecho: true,  puertaObligatoria: true,  estantesDisponibles: true,  paranteBase: 1, paranteOpcional: true, cajonera: false, esNicho: false, familiaFrente: 'Bajo' },
    'Cajonera':         { tieneTecho: false, puertaObligatoria: false, estantesDisponibles: false, paranteBase: 2, paranteOpcional: true, cajonera: true,  esNicho: false, familiaFrente: 'Bajo' },
  };

  function fondoDe_(cat) { return cat.esNicho ? FONDO_SIN_PUERTA : FONDO_CON_PUERTA; }

  /* ---------- Fórmulas por pieza ---------- */
  function calcBase(h, largoMod, prof, esNicho, fondo) {
    const ancho = esNicho ? (prof - fondo) : (prof - E - fondo);
    return { pieza: 'Base', largo: r2(largoMod - 2 * E), ancho: r2(ancho), espesor: E, tapacanto: '1 en Largo' };
  }
  function calcTecho(h, largoMod, prof, esNicho, fondo) {
    return Object.assign({}, calcBase(h, largoMod, prof, esNicho, fondo), { pieza: 'Techo' });
  }
  function calcLateral(h, largoMod, prof, esNicho, fondo) {
    const ancho = esNicho ? (prof - fondo) : (prof - E - fondo);
    return { pieza: 'Lateral', largo: r2(h), ancho: r2(ancho), espesor: E, tapacanto: '1 en Largo, 2 en Ancho' };
  }
  function calcFondoModulo(h, largoMod, fondo) {
    return { pieza: 'Fondo módulo', largo: r2(h), ancho: r2(largoMod), espesor: fondo, tapacanto: 'Ninguno' };
  }
  function calcParante(h, largoMod) {
    return { pieza: 'Parante', largo: r2(largoMod - 2 * E), ancho: 120, espesor: E, tapacanto: '2 en Largo' };
  }
  function calcEstanteFijo(h, largoMod, prof, fondo) {
    return { pieza: 'Estante fijo', largo: r2(largoMod - 2 * E), ancho: r2(prof - E - fondo - 10), espesor: E, tapacanto: '1 en Largo' };
  }
  function calcEstanteMovil(h, largoMod, prof, fondo) {
    return { pieza: 'Estante móvil', largo: r2(largoMod - 2 * E - 2), ancho: r2(prof - E - fondo - 10), espesor: E, tapacanto: '2 en Largo, 2 en Ancho' };
  }
  function calcularAnchoSimetrico_(anchoModulo, cantidad) {
    return (anchoModulo - 3 * cantidad) / cantidad;
  }
  function calcPuertaManual_(h, cortePuerta, anchoPuerta, largoManual, modalidad, anchoModulo, cantidad) {
    if (cortePuerta === 'Personalizada' || cortePuerta === 'Manual') {
      if (!(largoManual > 0)) throw new Error('Corte "Personalizada" requiere Largo cargado a mano (mayor a 0).');
      return { pieza: 'Puerta', cortePuerta: 'Personalizada', largo: r2(largoManual), ancho: r2(anchoPuerta),
               espesor: E, tapacanto: '2 en Largo, 2 en Ancho', _rol: 'Frente' };
    }
    if (!Object.prototype.hasOwnProperty.call(PUERTA_OFFSETS, cortePuerta)) {
      throw new Error('Corte de Puerta desconocido: "' + cortePuerta + '". Opciones válidas: ' +
                      Object.keys(PUERTA_OFFSETS).join(', ') + ', Personalizada');
    }
    let ancho;
    if (modalidad === 'Simetrica') {
      if (!(anchoModulo > 0)) throw new Error('Modalidad "Simétrica" necesita el Largo (L) del módulo cargado.');
      ancho = calcularAnchoSimetrico_(anchoModulo, cantidad || 1);
    } else {
      ancho = anchoPuerta;
    }
    return { pieza: 'Puerta', cortePuerta: cortePuerta, largo: r2(h + PUERTA_OFFSETS[cortePuerta]), ancho: r2(ancho),
             espesor: E, tapacanto: '2 en Largo, 2 en Ancho', _rol: 'Frente' };
  }
  function explotarPuerta_(p, h, anchoModulo) {
    const calc = calcPuertaManual_(h, p.cortePuerta, p.anchoPuerta, p.largoManual, p.modalidad, anchoModulo, p.cantidad);
    calc.tipoApertura = p.tipoApertura || '';
    calc.cantidad = p.cantidad || 1;
    return calc;
  }
  function explotarCajon_(c) {
    const esp = c.espesorFondo;
    if (esp !== 5 && esp !== 15) throw new Error('espesor de fondo inválido (' + c.espesorFondo + '); tiene que ser 5 o 15.');
    const restaFrenteAncho = (esp === 15) ? 30 : 20;
    const restaFondoAncho = (esp === 15) ? 2 * E : E;
    const frenteLargo = r2(c.largoCajon - 2 * E);
    const frenteAncho = r2(c.hCajon - restaFrenteAncho);
    return [
      { pieza: 'Lateral de cajón', largo: r2(c.profCajon), ancho: r2(c.hCajon), espesor: E, cantidad: 2, tapacanto: '2 en Ancho', _tipo: 'Cajón' },
      { pieza: 'Trasera', largo: frenteLargo, ancho: frenteAncho, espesor: E, cantidad: 2, tapacanto: '2 en Largo', _tipo: 'Cajón' },
      { pieza: 'Fondo de cajón', largo: r2(c.profCajon), ancho: r2(c.largoCajon - restaFondoAncho), espesor: esp, cantidad: 1, tapacanto: 'Ninguno', _tipo: 'Cajón' },
      { pieza: 'Frente Cajón', largo: r2(c.largoPlacaTirador), ancho: r2(c.anchoPlacaTirador), espesor: E, cantidad: 1,
        tapacanto: '2 en Largo, 2 en Ancho', _tipo: 'Cajón', _rol: 'Frente' },
    ];
  }

  /* ---------- Material ---------- */
  function resolverMaterial_(modulo, calc, overrides, proy, cat) {
    const key = modulo.idModulo + '|' + String(calc.pieza).trim().toLowerCase();
    if (overrides.has(key)) return overrides.get(key);
    if (modulo.materialPredeterminado) return modulo.materialPredeterminado;
    if (calc._rol === 'Frente') {
      const fam = (cat && cat.familiaFrente) || 'Bajo';
      const porRol = (fam === 'Alacena') ? proy.materialFrentesAlacenas : proy.materialFrentesBajos;
      if (porRol) return porRol;
    } else if (proy.materialInteriores) {
      return proy.materialInteriores;
    }
    return proy.materialProyecto || '';
  }
  function armarFila_(modulo, calc, overrides, proy, cat) {
    return {
      idModulo: modulo.idModulo,
      tipo: calc._tipo || modulo.tipo,
      pieza: calc.pieza,
      cortePuerta: calc.cortePuerta || '',
      tipoApertura: calc.tipoApertura || '',
      categoria: '',
      cantidad: calc.cantidad || calc._cant || 1,
      largo: calc.largo,
      ancho: calc.ancho,
      espesor: calc.espesor,
      material: resolverMaterial_(modulo, calc, overrides, proy, cat),
      tapacanto: calc.tapacanto,
      observaciones: calc._obs || '',
    };
  }

  /* ---------- Explosión de un módulo ---------- */
  function explotarModulo(modulo, overrides, proy) {
    const cat = CATALOGO[modulo.tipo];
    if (!cat) {
      throw new Error('Tipo de módulo desconocido: "' + modulo.tipo + '" (ID ' + modulo.idModulo +
                      '). Tipos válidos: ' + Object.keys(CATALOGO).join(', '));
    }
    const h = modulo.h, largo = modulo.largo, prof = modulo.profundidad, fondo = fondoDe_(cat);
    const filas = [];
    const push = (calc) => filas.push(armarFila_(modulo, calc, overrides, proy, cat));

    push(calcBase(h, largo, prof, cat.esNicho, fondo));
    if (cat.tieneTecho) push(calcTecho(h, largo, prof, cat.esNicho, fondo));
    { const c = calcLateral(h, largo, prof, cat.esNicho, fondo); c._cant = 2; push(c); }
    if (modulo.conFondo) push(calcFondoModulo(h, largo, fondo));
    if (cat.paranteBase > 0) { const c = calcParante(h, largo); c._cant = cat.paranteBase; push(c); }
    if (cat.paranteOpcional && modulo.cantParantesExtras > 0) { const c = calcParante(h, largo); c._cant = modulo.cantParantesExtras; push(c); }
    if (cat.estantesDisponibles) {
      const nf = modulo.cantEstantesFijos || 0, nm = modulo.cantEstantesMoviles || 0;
      if (nf > 0) { const c = calcEstanteFijo(h, largo, prof, fondo); c._cant = nf; push(c); }
      if (nm > 0) { const c = calcEstanteMovil(h, largo, prof, fondo); c._cant = nm; push(c); }
    }
    return filas;
  }

  /* ---------- Lectura del proyecto (equivalente a leerXxx_) ---------- */
  const num = (v) => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const str = (v) => (v === undefined || v === null) ? '' : String(v);

  function leerProyecto_(d) {
    const r = d.proyecto || {};
    if (!str(r.nombre).trim()) throw new Error('El proyecto no tiene nombre cargado.');
    return {
      nombre: str(r.nombre).trim(), cliente: r.cliente || '', fecha: r.fecha || '', modo: r.modoMaterial || '',
      materialProyecto: r.materialProyecto || '', materialInteriores: r.materialInteriores || '',
      materialFrentesBajos: r.materialFrentesBajos || '', materialFrentesAlacenas: r.materialFrentesAlacenas || '',
      observaciones: r.observaciones || '',
    };
  }
  function leerOverrides_(d) {
    const map = new Map();
    (d.overrides || []).forEach(r => {
      const material = str(r.material).trim();
      const esPorDefecto = material.toLowerCase() === 'por defecto';
      if (str(r.idModulo).trim() && str(r.pieza).trim() && material && !esPorDefecto) {
        map.set(str(r.idModulo).trim() + '|' + str(r.pieza).trim().toLowerCase(), material);
      }
    });
    return map;
  }
  function leerModulos_(d) {
    return (d.modulos || []).filter(r => str(r.tipo) !== '').map(r => ({
      idModulo: str(r.id).trim(),
      tipo: r.tipo,
      ambiente: r.ambiente || '',
      h: num(r.h), largo: num(r.l), profundidad: num(r.p),
      materialPredeterminado: r.material || '',
      cantEstantesFijos: num(r.eFijo), cantEstantesMoviles: num(r.eMovil), cantParantesExtras: num(r.pteExtra),
      conFondo: r.fondo !== false,
      observaciones: r.observaciones || '',
    }));
  }
  function leerCajones_(d) {
    const map = new Map();
    (d.cajones || []).filter(r => str(r.idModulo) !== '').forEach(r => {
      const id = str(r.idModulo).trim();
      const c = { hCajon: num(r.h), largoCajon: num(r.l), profCajon: num(r.p), espesorFondo: num(r.fondo),
                  largoPlacaTirador: num(r.lPlaca), anchoPlacaTirador: num(r.aPlaca) };
      if (!map.has(id)) map.set(id, []);
      map.get(id).push(c);
    });
    return map;
  }
  function esCorteConOffsetFijo_(corte) { return Object.prototype.hasOwnProperty.call(PUERTA_OFFSETS, corte); }
  function normModalidad_(m) {
    const t = str(m).trim();
    if (!t) return '';
    return t.normalize('NFD').replace(/[̀-ͯ]/g, '');   // "Simétrica" -> "Simetrica"
  }
  function leerPuertas_(d) {
    const map = new Map();
    (d.puertas || []).filter(r => str(r.idModulo) !== '').forEach(r => {
      const id = str(r.idModulo).trim();
      const corte = r.corte || '';
      const p = {
        cortePuerta: corte,
        modalidad: normModalidad_(r.modalidad) || (esCorteConOffsetFijo_(corte) ? 'Manual' : ''),
        tipoApertura: r.tipo || '',
        cantidad: num(r.cant) || 1,
        anchoPuerta: Number(r.ancho),
        largoManual: num(r.largo) || 0,
      };
      if (!map.has(id)) map.set(id, []);
      map.get(id).push(p);
    });
    return map;
  }
  function tapacantoTexto_(cantLargo, cantAncho) {
    const partes = [];
    if (cantLargo > 0) partes.push(cantLargo + ' en Largo');
    if (cantAncho > 0) partes.push(cantAncho + ' en Ancho');
    return partes.length ? partes.join(', ') : 'Ninguno';
  }
  function leerPiezasSueltas_(d) {
    const porModulo = new Map();
    const sueltas = [];
    (d.sueltas || []).filter(r => str(r.descripcion) !== '').forEach(r => {
      const tapLargo = num(r.tcl) || 0, tapAncho = num(r.tca) || 0;
      const p = {
        pieza: str(r.descripcion).trim(),
        categoria: str(r.categoria || 'Sin categoría').trim(),
        idModulo: str(r.idModulo).trim(),
        cantidad: num(r.cant) || 1,
        largo: num(r.l) || 0, ancho: num(r.a) || 0,
        espesor: num(r.e) || E,
        material: r.material || '',
        tapacanto: tapacantoTexto_(tapLargo, tapAncho),
        observaciones: r.observaciones || '',
      };
      if (p.idModulo) {
        if (!porModulo.has(p.idModulo)) porModulo.set(p.idModulo, []);
        porModulo.get(p.idModulo).push(p);
      } else sueltas.push(p);
    });
    return { porModulo, sueltas };
  }
  function filaDePiezaSuelta_(p, proy) {
    return {
      idModulo: p.idModulo || '-', tipo: p.categoria, pieza: p.pieza, cortePuerta: '', tipoApertura: '',
      categoria: p.categoria, cantidad: p.cantidad, largo: p.largo, ancho: p.ancho, espesor: p.espesor,
      material: p.material || proy.materialProyecto || '', tapacanto: p.tapacanto, observaciones: p.observaciones,
    };
  }
  function parseIdCatalogo_(valor) {
    const texto = str(valor).trim();
    const m = texto.match(/^(\d+)/);
    return m ? { id: Number(m[1]), etiqueta: texto } : null;
  }
  function leerTapacantos_(d) {
    const mapa = new Map();
    (d.tapacantos || []).forEach(row => {
      const idModulo = str(row.idModulo).trim();
      const pieza = str(row.pieza).trim();
      if (!pieza) return;
      const clave = idModulo + '|' + pieza.toLowerCase();
      if (!mapa.has(clave)) mapa.set(clave, []);
      mapa.get(clave).push({
        cantidad: num(row.cantidad) || 0,
        arr: num(row.arr) || 0, ab: num(row.ab) || 0, izq: num(row.izq) || 0, der: num(row.der) || 0,
        materialPlaca: parseIdCatalogo_(row.materialPlaca),
        tapacantoPrincipal: parseIdCatalogo_(row.tapPrincipal),
        tapacantoSecundario: parseIdCatalogo_(row.tapSecundario),
      });
    });
    return mapa;
  }

  /* ---------- Agrupamiento y nombres ---------- */
  function claveParaCorte_(f) {
    return [f.idModulo, f.cortePuerta || f.pieza, f.categoria || '', f.material, f.largo, f.ancho,
            f.espesor, f.tapacanto, f.observaciones].join('||');
  }
  function agruparGenerico_(piezas, claveFn) {
    const grupos = new Map();
    piezas.forEach(f => {
      const clave = claveFn(f);
      if (grupos.has(clave)) grupos.get(clave).cantidad += f.cantidad;
      else grupos.set(clave, Object.assign({}, f));
    });
    return Array.from(grupos.values());
  }
  function agruparParaCorte_(piezas) { return agruparGenerico_(piezas, claveParaCorte_); }
  function claveParaTaller_(f) {
    return [f.idModulo, f.pieza, f.cortePuerta || '', f.tipoApertura || '', f.categoria || '',
            f.material, f.largo, f.ancho, f.espesor, f.tapacanto].join('||');
  }
  function agruparParaTaller_(piezas) { return agruparGenerico_(piezas, claveParaTaller_); }
  function nombrePiezaSuelta_(f) { return f.categoria ? f.categoria + ' · ' + f.pieza : f.pieza; }
  function nombreParaCorte_(f) { return f.cortePuerta || nombrePiezaSuelta_(f); }
  function nombreParaProveedor_(f) { return f.cortePuerta ? 'Puerta' : nombrePiezaSuelta_(f); }
  function parseTapacanto_(s) {
    if (!s) return { largo: 0, ancho: 0 };
    const mL = String(s).match(/(\d+)\s*en Largo/), mA = String(s).match(/(\d+)\s*en Ancho/);
    return { largo: mL ? parseInt(mL[1], 10) : 0, ancho: mA ? parseInt(mA[1], 10) : 0 };
  }
  function filaCorte_(f) {
    const tap = parseTapacanto_(f.tapacanto);
    return { idModulo: f.idModulo, pieza: nombreParaCorte_(f), material: f.material, cantidad: f.cantidad,
             largo: f.largo, ancho: f.ancho, espesor: f.espesor,
             tapLargo: tap.largo || '-', tapAncho: tap.ancho || '-', observaciones: f.observaciones };
  }
  function materialEfectivoDe_(m, proy) {
    return m.materialPredeterminado || proy.materialInteriores || proy.materialProyecto || '';
  }

  /* ---------- Generar ---------- */
  function generar(d) {
    let proy, overrides, modulos, cajones, puertas, piezasSueltas;
    try {
      proy = leerProyecto_(d);
      overrides = leerOverrides_(d);
      modulos = leerModulos_(d);
      cajones = leerCajones_(d);
      puertas = leerPuertas_(d);
      piezasSueltas = leerPiezasSueltas_(d);
    } catch (e) {
      return { ok: false, mensaje: e.message, avisos: [e.message] };
    }

    const piezasCrudas = [], alertas = [], bloques = [];
    const idsVistos = new Set(), idsCajonesVinculados = new Set();

    modulos.forEach(m => {
      if (!m.tipo) return;
      if (idsVistos.has(m.idModulo)) {
        alertas.push('ID Módulo repetido: "' + m.idModulo + '". Revisá la columna Ambiente, porque el ID se arma a partir de ahí.');
      }
      idsVistos.add(m.idModulo);

      let filas;
      try { filas = explotarModulo(m, overrides, proy); }
      catch (e) { alertas.push(e.message); return; }
      const cat = CATALOGO[m.tipo];

      if (cat.cajonera) {
        idsCajonesVinculados.add(m.idModulo);
        const lista = cajones.get(m.idModulo) || [];
        if (lista.length === 0) alertas.push('Módulo ' + m.idModulo + ' (Cajonera): no tiene cajones cargados.');
        lista.forEach((c, i) => {
          if (c.hCajon < H_MIN_CAJON) {
            alertas.push('Módulo ' + m.idModulo + ', cajón ' + (i + 1) + ': H de Cajón (' + c.hCajon +
                         'mm) está por debajo del mínimo funcional de ' + H_MIN_CAJON + 'mm.');
          }
          try { explotarCajon_(c).forEach(calc => filas.push(armarFila_(m, calc, overrides, proy, cat))); }
          catch (e) { alertas.push('Módulo ' + m.idModulo + ', cajón ' + (i + 1) + ': ' + e.message); }
        });
      }

      const listaPuertas = puertas.get(m.idModulo) || [];
      if (cat.puertaObligatoria && listaPuertas.length === 0) {
        alertas.push('Módulo ' + m.idModulo + ' (' + m.tipo + '): no tiene puertas cargadas.');
      }
      listaPuertas.forEach((p, i) => {
        try { filas.push(armarFila_(m, explotarPuerta_(p, m.h, m.largo), overrides, proy, cat)); }
        catch (e) { alertas.push('Módulo ' + m.idModulo + ', puerta ' + (i + 1) + ': ' + e.message); }
      });

      const nombresYaGenerados = new Set(filas.map(f => String(f.pieza).trim().toLowerCase()));
      (piezasSueltas.porModulo.get(m.idModulo) || []).forEach(p => {
        if (nombresYaGenerados.has(String(p.pieza).trim().toLowerCase())) {
          alertas.push('Módulo ' + m.idModulo + ': la pieza "' + p.pieza + '" está cargada en Piezas Sueltas y además la calcula el motor, ' +
                       'así que va a salir DOS veces. Si querés reemplazar la calculada, poné en 0 su cantidad en el módulo.');
        }
        filas.push(filaDePiezaSuelta_(p, proy));
      });

      filas.forEach(f => piezasCrudas.push(f));
      bloques.push({ modulo: m, materialEfectivo: materialEfectivoDe_(m, proy), filas });
    });

    const porCategoria = new Map();
    piezasSueltas.sueltas.forEach(p => {
      if (!porCategoria.has(p.categoria)) porCategoria.set(p.categoria, []);
      const fila = filaDePiezaSuelta_(p, proy);
      porCategoria.get(p.categoria).push(fila);
      piezasCrudas.push(fila);
    });

    piezasSueltas.porModulo.forEach((lista, id) => {
      if (!idsVistos.has(id)) {
        alertas.push('En Piezas Sueltas hay ' + lista.length + ' pieza(s) con ID Módulo "' + id +
                     '", que no existe en Módulos. Esas piezas no salieron en el despiece.');
      }
    });

    cajones.forEach((lista, id) => {
      if (idsCajonesVinculados.has(id)) return;
      const idMostrado = id || '(sin ID Módulo)';
      const categoria = 'Cajón sin vincular a una Cajonera — ' + idMostrado;
      if (!porCategoria.has(categoria)) porCategoria.set(categoria, []);
      const moduloSintetico = { idModulo: idMostrado, tipo: 'Cajonera' };
      lista.forEach((c, i) => {
        if (c.hCajon < H_MIN_CAJON) {
          alertas.push('Cajón sin vincular a una Cajonera (ID Módulo "' + idMostrado + '"), cajón ' + (i + 1) +
                       ': H de Cajón (' + c.hCajon + 'mm) está por debajo del mínimo funcional de ' + H_MIN_CAJON + 'mm.');
        }
        try {
          explotarCajon_(c).forEach(calc => {
            const fila = armarFila_(moduloSintetico, calc, overrides, proy, CATALOGO['Cajonera']);
            porCategoria.get(categoria).push(fila);
            piezasCrudas.push(fila);
          });
        } catch (e) {
          alertas.push('Cajón sin vincular a una Cajonera (ID Módulo "' + idMostrado + '"), cajón ' + (i + 1) + ': ' + e.message);
        }
      });
      alertas.push('Hay ' + lista.length + ' cajón(es) cargado(s) con ID Módulo "' + idMostrado +
                   '", que no corresponde a ningún módulo tipo Cajonera. Se despiezaron igual, en una sección aparte.');
    });

    const tapacantosPorClave = leerTapacantos_(d);
    const filasCorte = [], filasProveedor = [];
    agruparParaCorte_(piezasCrudas).forEach(f => {
      const nombreParaMatch = nombreParaCorte_(f);
      const clave = f.idModulo + '|' + nombreParaMatch.toLowerCase();
      const contexto = (f.idModulo || '(sin módulo)') + ' / ' + nombreParaMatch;

      if (tapacantosPorClave.has(clave)) {
        const configs = tapacantosPorClave.get(clave);
        const explicitas = configs.filter(c => c.cantidad > 0);
        const abiertas = configs.filter(c => !(c.cantidad > 0));
        let restante = f.cantidad;

        explicitas.forEach(c => {
          const disponibleAntes = restante;
          const tomado = Math.min(c.cantidad, restante);
          if (tomado > 0) {
            filasProveedor.push(Object.assign({}, f, { cantidad: tomado, nombreMostrado: nombreParaProveedor_(f), canto: c }));
            restante -= tomado;
          }
          if (tomado < c.cantidad) {
            alertas.push('En Tapacantos, "' + contexto + '" pide ' + c.cantidad + ' unidad(es), pero sólo había ' +
                         disponibleAntes + ' disponible(s) en ese momento -- se cubrió lo que había, revisá esa fila.');
          }
        });
        if (abiertas.length > 1) {
          alertas.push('En Tapacantos, "' + contexto + '" tiene ' + abiertas.length + ' filas sin Cantidad puesta ("todo lo que quede") -- ' +
                       'sólo se usó la primera, poné una cantidad puntual en las demás.');
        }
        if (abiertas.length > 0 && restante > 0) {
          filasProveedor.push(Object.assign({}, f, { cantidad: restante, nombreMostrado: nombreParaProveedor_(f), canto: abiertas[0] }));
          restante = 0;
        }
        if (restante > 0) filasCorte.push(filaCorte_(Object.assign({}, f, { cantidad: restante })));
      } else {
        filasCorte.push(filaCorte_(f));
      }
    });

    // Salidas ya estructuradas
    const taller = agruparParaTaller_(piezasCrudas).map(f => {
      const tap = parseTapacanto_(f.tapacanto);
      return { pieza: f.pieza, cortePuerta: f.cortePuerta || '', tipoPuerta: f.tipoApertura || '', material: f.material,
               cantidad: f.cantidad, largo: f.largo, ancho: f.ancho, espesor: f.espesor,
               tapLargo: tap.largo || 0, tapAncho: tap.ancho || 0, modulos: f.idModulo, categoria: f.categoria || '' };
    });
    const proveedor = filasProveedor.map(f => ({
      idModulo: f.idModulo, pieza: f.nombreMostrado, material: f.material,
      materialPlaca: f.canto.materialPlaca ? f.canto.materialPlaca.etiqueta : '',
      tapacantoPrincipal: f.canto.tapacantoPrincipal ? f.canto.tapacantoPrincipal.etiqueta : '',
      tapacantoSecundario: f.canto.tapacantoSecundario ? f.canto.tapacantoSecundario.etiqueta : '',
      largo: f.largo, ancho: f.ancho, espesor: f.espesor, cantidad: f.cantidad,
      arr: f.canto.arr, ab: f.canto.ab, izq: f.canto.izq, der: f.canto.der,
    }));

    // Orden de Fabricación: bloques de módulo + secciones de sueltas
    const orden = {
      modulos: bloques.map(b => ({
        idModulo: b.modulo.idModulo, tipo: b.modulo.tipo, ambiente: b.modulo.ambiente,
        h: b.modulo.h, l: b.modulo.largo, p: b.modulo.profundidad,
        material: b.materialEfectivo, observaciones: b.modulo.observaciones || '',
        piezas: ordenPiezas_(b.filas, b.materialEfectivo),
      })),
      secciones: Array.from(porCategoria.entries()).map(([cat, filas]) => ({ categoria: cat, piezas: ordenPiezas_(filas, null) })),
    };

    let msg = 'Listo. Se generaron ' + filasCorte.length + ' líneas de corte para ' + modulos.length + ' módulo(s).';
    if (filasProveedor.length > 0) {
      msg += ' ' + filasProveedor.length + ' pieza(s) más se excluyeron de Lista de Corte por estar cargadas en Tapacantos (van a Piezas Proveedor).';
    }
    return { ok: true, mensaje: msg, proyecto: proy, corte: filasCorte, orden, taller, proveedor, avisos: alertas,
             modulos: modulos.length };
  }

  // Una fila de Orden de Fabricación: nombre + (xN), medidas, material sólo si difiere.
  function ordenPiezas_(filas, materialDefecto) {
    return filas.map(f => {
      const nombreBase = f.cortePuerta
        ? (f.tipoApertura ? f.cortePuerta + ' ' + f.tipoApertura : f.cortePuerta)
        : nombrePiezaSuelta_(f);
      const tap = parseTapacanto_(f.tapacanto);
      return {
        nombre: nombreBase + (f.cantidad > 1 ? ' x' + f.cantidad : ''),
        nombreBase: nombreBase,
        tapLargo: tap.largo || '-', tapAncho: tap.ancho || '-',
        pieza: nombreParaCorte_(f), cantidad: f.cantidad,
        largo: f.largo, ancho: f.ancho, espesor: f.espesor,
        material: (materialDefecto === null || f.material !== materialDefecto) ? f.material : '',
        tapacanto: f.tapacanto,
      };
    });
  }

  /* ---------- Helpers para formularios ---------- */
  function variantesPiezaDeModulo(d, idModulo) {
    const m = leerModulos_(d).find(x => x.idModulo === idModulo);
    if (!m || !m.tipo) return [];
    const cat = CATALOGO[m.tipo];
    if (!cat) return [];
    const overrides = leerOverrides_(d);
    let proy;
    try { proy = leerProyecto_(d); } catch (e) { proy = { materialProyecto: '', materialInteriores: '', materialFrentesBajos: '', materialFrentesAlacenas: '' }; }

    const vistos = new Map();
    const agregar = f => {
      const nombre = nombreParaCorte_(f);
      const clave = [nombre, f.largo, f.ancho, f.espesor].join('|');
      const cant = f.cantidad || 1;
      if (!vistos.has(clave)) {
        const tap = parseTapacanto_(f.tapacanto);
        vistos.set(clave, { nombre, largo: f.largo, ancho: f.ancho, espesor: f.espesor,
                            tapLargo: tap.largo, tapAncho: tap.ancho, cantidad: cant });
      } else vistos.get(clave).cantidad += cant;
    };
    try { explotarModulo(m, overrides, proy).forEach(agregar); } catch (e) { /* ya se avisa en generar */ }
    (leerPuertas_(d).get(idModulo) || []).forEach(p => {
      try { agregar(armarFila_(m, explotarPuerta_(p, m.h, m.largo), overrides, proy, cat)); } catch (e) { /* idem */ }
    });
    (leerCajones_(d).get(idModulo) || []).forEach(c => {
      try { explotarCajon_(c).forEach(calc => agregar(armarFila_(m, calc, overrides, proy, cat))); } catch (e) { /* idem */ }
    });
    return Array.from(vistos.values());
  }

  // Variantes + piezas sueltas (mismo criterio que variantesParaTapacantos_ del trigger)
  function variantesParaTapacantos(d, idModulo) {
    const out = idModulo ? variantesPiezaDeModulo(d, idModulo) : [];
    (d.sueltas || []).filter(r => str(r.descripcion) !== '' && str(r.idModulo).trim() === (idModulo || '')).forEach(r => {
      const f = { categoria: str(r.categoria || 'Sin categoría').trim(), pieza: str(r.descripcion).trim() };
      out.push({ nombre: nombrePiezaSuelta_(f), largo: num(r.l) || 0, ancho: num(r.a) || 0, espesor: num(r.e) || E,
                 tapLargo: num(r.tcl) || 0, tapAncho: num(r.tca) || 0, cantidad: num(r.cant) || 1 });
    });
    return out;
  }

  // Nombres genéricos de pieza para Override
  function nombresPiezasDeModulo(d, idModulo) {
    const m = (d.modulos || []).find(x => str(x.id).trim() === idModulo);
    if (!m) return [];
    const c = CATALOGO[m.tipo];
    if (!c) return [];
    const nombres = ['Base', 'Lateral', 'Fondo módulo'];
    if (c.tieneTecho) nombres.push('Techo');
    const paranteCant = c.paranteBase + (c.paranteOpcional ? num(m.pteExtra) : 0);
    if (paranteCant > 0) nombres.push('Parante');
    if (c.estantesDisponibles) {
      if (num(m.eFijo) > 0) nombres.push('Estante fijo');
      if (num(m.eMovil) > 0) nombres.push('Estante móvil');
    }
    if ((d.puertas || []).some(r => str(r.idModulo).trim() === idModulo)) nombres.push('Puerta');
    if ((d.cajones || []).some(r => str(r.idModulo).trim() === idModulo)) {
      nombres.push('Lateral de cajón', 'Trasera', 'Fondo de cajón', 'Frente Cajón');
    }
    return nombres;
  }

  // ID de módulo: contador de módulos de ese ambiente + 1 (2 dígitos) + código de ambiente
  function siguienteId(modulos, ambiente, codigo, excluir) {
    const otros = (modulos || []).filter(m => m !== excluir);
    const usados = new Set(otros.map(m => str(m.id).trim()));
    let n = otros.filter(m => m.ambiente === ambiente).length + 1;
    let id = ('0' + n).slice(-2) + codigo;
    while (usados.has(id)) { n++; id = ('0' + n).slice(-2) + codigo; }
    return id;
  }

  // Validación no bloqueante de Tapacantos (posición vs. T.L./T.A.)
  function validarTapacanto(variante, t) {
    if (!variante) return 'La pieza no es válida hoy para ese módulo.';
    const debe = { arr: variante.tapLargo >= 1, ab: variante.tapLargo >= 2, izq: variante.tapAncho >= 1, der: variante.tapAncho >= 2 };
    const nom = { arr: 'Arr.', ab: 'Ab.', izq: 'Izq.', der: 'Der.' };
    const extra = [], falta = [];
    ['arr', 'ab', 'izq', 'der'].forEach(k => {
      const marcado = num(t[k]) > 0;
      if (marcado && !debe[k]) extra.push(nom[k]);
      if (!marcado && debe[k]) falta.push(nom[k]);
    });
    if (!extra.length && !falta.length) return '';
    const partes = [];
    if (extra.length) partes.push('de más: ' + extra.join(', '));
    if (falta.length) partes.push('falta: ' + falta.join(', '));
    return 'canto ' + partes.join(' · ') + ' según T.L.=' + variante.tapLargo + ', T.A.=' + variante.tapAncho + '.';
  }

  const api = {
    CATALOGO, PUERTA_OFFSETS, ESPESORES_FONDO_CAJON, H_MIN_CAJON, E,
    generar, variantesPiezaDeModulo, variantesParaTapacantos, nombresPiezasDeModulo, siguienteId, validarTapacanto,
    calcularAnchoSimetrico_, parseTapacanto_,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Motor = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   ALMACENAMIENTO — proyecto en memoria, autoguardado local, archivos
   .json y sincronización con GitHub (API de contenidos).
   ===================================================================== */
(function (root) {
  'use strict';

  const VERSION_DATOS = 1;
  const K_IDX = 'despiece:idx';
  const K_PROY = 'despiece:p:';
  const K_ULTIMO = 'despiece:ultimo';
  const K_GH = 'despiece:gh';
  const K_LISTAS = 'despiece:listas';

  /* ---------- localStorage con red de seguridad ---------- */
  const memoria = {};
  let localOk = true;
  function lsGet(k) {
    try { const v = localStorage.getItem(k); return v === null ? (memoria[k] ?? null) : v; }
    catch (e) { localOk = false; return memoria[k] ?? null; }
  }
  function lsSet(k, v) {
    memoria[k] = v;
    try { localStorage.setItem(k, v); return true; }
    catch (e) { localOk = false; return false; }
  }
  function lsDel(k) {
    delete memoria[k];
    try { localStorage.removeItem(k); } catch (e) { localOk = false; }
  }
  function lsJson(k, def) { try { const v = lsGet(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }

  /* ---------- Listas por defecto ---------- */
  const LISTAS_BASE = {
    ambientes: [
      { nombre: 'Cocina', codigo: 'Coc' }, { nombre: 'Living/Estar', codigo: 'Liv' },
      { nombre: 'Comedor', codigo: 'Com' }, { nombre: 'Dormitorio Principal', codigo: 'DorP' },
      { nombre: 'Dormitorio', codigo: 'Dor' }, { nombre: 'Toilette/Baño Visitas', codigo: 'BVis' },
      { nombre: 'Lavadero', codigo: 'Lav' }, { nombre: 'Vestidor', codigo: 'Vst' },
      { nombre: 'Home Office/Estudio', codigo: 'HO' }, { nombre: 'Baño Principal', codigo: 'BñoP' },
    ],
    materiales: [],
    tiposPuerta: ['Push', 'Abatible', 'c·Buña'],
    categoriasSueltas: ['Perfil L', 'Aplicados', 'Ajustes', 'Otros', 'Pisos'],
    // Módulos tipo: plantillas de carga. Los de acá son ejemplos editables; los propios se agregan con “Guardar como tipo”.
    // cajones: dl / dlPlaca = diferencia respecto del L del módulo, para que escalen cuando cambia el ancho.
    modulosTipo: [
      { nombre: 'Bajo 2 puertas', modulo: { tipo: 'Bajos', h: 720, l: '', p: 560, material: '', eMovil: 0, eFijo: 0, pteExtra: 0, fondo: true, observaciones: '' },
        puertas: [{ cant: 2, corte: 'Puerta32', modalidad: 'Simetrica', largo: '', ancho: '', tipo: '' }], cajones: [] },
      { nombre: 'Bajo 1 puerta', modulo: { tipo: 'Bajos', h: 720, l: '', p: 560, material: '', eMovil: 0, eFijo: 0, pteExtra: 0, fondo: true, observaciones: '' },
        puertas: [{ cant: 1, corte: 'Puerta32', modalidad: 'Simetrica', largo: '', ancho: '', tipo: '' }], cajones: [] },
      { nombre: 'Alacena 2 puertas', modulo: { tipo: 'Alacena', h: 700, l: '', p: 320, material: '', eMovil: 0, eFijo: 0, pteExtra: 0, fondo: true, observaciones: '' },
        puertas: [{ cant: 2, corte: 'Puerta2', modalidad: 'Simetrica', largo: '', ancho: '', tipo: '' }], cajones: [] },
      { nombre: 'Nicho abierto', modulo: { tipo: 'Nicho Abierto', h: 720, l: '', p: 560, material: '', eMovil: 0, eFijo: 0, pteExtra: 0, fondo: true, observaciones: '' },
        puertas: [], cajones: [] },
    ],
  };
  function listasPorDefecto() {
    const g = lsJson(K_LISTAS, null);
    const l = JSON.parse(JSON.stringify(g || LISTAS_BASE));
    if (!Array.isArray(l.modulosTipo)) l.modulosTipo = JSON.parse(JSON.stringify(LISTAS_BASE.modulosTipo));
    return l;
  }
  function guardarListasPorDefecto(l) { lsSet(K_LISTAS, JSON.stringify(l)); }

  /* ---------- Proyecto nuevo ---------- */
  function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function nuevoProyecto(nombre) {
    return {
      version: VERSION_DATOS,
      meta: { id: uid(), creado: new Date().toISOString(), modificado: new Date().toISOString(), archivo: '', sha: '' },
      listas: listasPorDefecto(),
      proyecto: { nombre: nombre || '', cliente: '', fecha: hoyISO(), modoMaterial: 'Uniforme', materialProyecto: '',
                  materialInteriores: '', materialFrentesBajos: '', materialFrentesAlacenas: '', observaciones: '' },
      modulos: [], puertas: [], cajones: [], overrides: [], sueltas: [], tapacantos: [],
      cortadas: {},   // piezas marcadas como cortadas en la vista Taller: { clave: true }
    };
  }

  // Migraciones: si algún día cambia el formato, se agrega un paso acá.
  function migrar(d) {
    if (!d || typeof d !== 'object') throw new Error('El archivo no es un proyecto válido.');
    if (!d.proyecto) throw new Error('El archivo no tiene datos de proyecto.');
    const base = nuevoProyecto();
    const out = Object.assign({}, base, d);
    out.meta = Object.assign({}, base.meta, d.meta || {});
    out.listas = Object.assign({}, base.listas, d.listas || {});
    out.proyecto = Object.assign({}, base.proyecto, d.proyecto);
    ['modulos', 'puertas', 'cajones', 'overrides', 'sueltas', 'tapacantos'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
    if (!out.cortadas || typeof out.cortadas !== 'object' || Array.isArray(out.cortadas)) out.cortadas = {};
    if (!Array.isArray(out.listas.modulosTipo)) out.listas.modulosTipo = JSON.parse(JSON.stringify(LISTAS_BASE.modulosTipo));
    out.version = VERSION_DATOS;
    return out;
  }

  /* ---------- Índice de proyectos locales ---------- */
  function indice() { return lsJson(K_IDX, []); }
  function guardarLocal(d) {
    d.meta.modificado = new Date().toISOString();
    const ok = lsSet(K_PROY + d.meta.id, JSON.stringify(d));
    const idx = indice().filter(x => x.id !== d.meta.id);
    idx.unshift({ id: d.meta.id, nombre: d.proyecto.nombre || '(sin nombre)', modificado: d.meta.modificado,
                  archivo: d.meta.archivo || '' });
    lsSet(K_IDX, JSON.stringify(idx));
    lsSet(K_ULTIMO, d.meta.id);
    return ok;
  }
  function cargarLocal(id) { const v = lsGet(K_PROY + id); return v ? migrar(JSON.parse(v)) : null; }
  function borrarLocal(id) {
    lsDel(K_PROY + id);
    lsSet(K_IDX, JSON.stringify(indice().filter(x => x.id !== id)));
    if (lsGet(K_ULTIMO) === id) lsDel(K_ULTIMO);
  }
  function ultimoId() { return lsGet(K_ULTIMO); }
  function localDisponible() { return localOk; }

  /* ---------- Archivos .json ---------- */
  function slug(s) {
    return (s || 'proyecto').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '').slice(0, 60) || 'proyecto';
  }
  function serializar(d) { return JSON.stringify(d, null, 2); }
  function descargar(nombre, texto, tipo) {
    const blob = new Blob([texto], { type: tipo || 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- Catálogo Dilegno (IndexedDB, puede ser grande) ---------- */
  let catalogo = [];
  function idb() {
    return new Promise((res, rej) => {
      if (typeof indexedDB === 'undefined') return rej(new Error('sin IndexedDB'));
      const rq = indexedDB.open('despiece', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  async function catalogoGuardar(items) {
    catalogo = items;
    try {
      const db = await idb();
      await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(items, 'catalogo'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { /* queda sólo en memoria durante esta sesión */ }
  }
  async function catalogoCargarLocal() {
    try {
      const db = await idb();
      const v = await new Promise((res, rej) => { const rq = db.transaction('kv').objectStore('kv').get('catalogo'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
      if (Array.isArray(v)) catalogo = v;
    } catch (e) { /* sin catálogo guardado */ }
    return catalogo;
  }
  function normalizarCatalogo(arr) {
    if (!Array.isArray(arr)) throw new Error('El catálogo tiene que ser una lista (array) de materiales.');
    return arr.map(x => ({ id: Number(x.id), code: String(x.code || ''), description: String(x.description || ''), tipo: Number(x.tipo) || 0 }))
      .filter(x => !isNaN(x.id));
  }
  // Orden de preferencia: el catálogo incluido en el HTML → catalogo/materiales.json junto al HTML → el del repositorio privado en GitHub.
  async function catalogoAutomatico() {
    const firma = (a) => a.length + ':' + (a[0] ? a[0].id : '') + ':' + (a[a.length - 1] ? a[a.length - 1].id : '');
    try {
      const emb = leerJsonEmbebido('catalogo-embebido');
      if (Array.isArray(emb) && emb.length) {
        const items = normalizarCatalogo(emb), f = firma(items);
        if (!catalogo.length || lsGet('despiece:catfirma') !== f) { await catalogoGuardar(items); lsSet('despiece:catfirma', f); }
        return 'incluido';
      }
    } catch (e) { /* sigue con las otras fuentes */ }
    try {
      if (typeof fetch === 'function' && /^https?:/.test(location.protocol)) {
        const r = await fetch('catalogo/materiales.json', { cache: 'no-cache' });
        if (r.ok) { const items = normalizarCatalogo(await r.json()); if (items.length) { await catalogoGuardar(items); return 'sitio'; } }
      }
    } catch (e) { /* no hay archivo junto al HTML */ }
    try { if (ghListo() && !catalogo.length) { const items = await ghTraerCatalogo(); if (items.length) { await catalogoGuardar(items); return 'github'; } } } catch (e) { /* sin catálogo en GitHub */ }
    return catalogo.length ? 'guardado' : '';
  }
  function catalogoBuscar(texto, tipo, max) {
    const toks = String(texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < catalogo.length && out.length < (max || 40); i++) {
      const it = catalogo[i];
      if (tipo !== undefined && tipo !== null && it.tipo !== tipo) continue;
      const hay = (it.id + ' ' + it.code + ' ' + it.description).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      if (toks.every(t => hay.indexOf(t) !== -1)) out.push(it);
    }
    return out;
  }
  function etiquetaCatalogo(it) { return it.id + ' — ' + (it.description || it.code); }

  /* ---------- GitHub ---------- */
  // Configuración que puede venir "de fábrica" dentro del propio HTML (build.py la inserta desde config.local.json).
  function leerJsonEmbebido(id) {
    try { const e = document.getElementById(id); const t = e && e.textContent.trim(); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function ghConfig() {
    const base = { owner: '', repo: '', branch: 'main', carpeta: 'proyectos', token: '' };
    const guardada = lsJson(K_GH, {});
    if (guardada.off) return Object.assign({}, base, guardada);      // el usuario desconectó a propósito
    const emb = leerJsonEmbebido('cfg-embebida') || {};
    const out = {};
    Object.keys(base).forEach(k => { out[k] = guardada[k] || emb[k] || base[k]; });
    return out;
  }
  function ghEmbebida() { const e = leerJsonEmbebido('cfg-embebida'); return !!(e && (e.owner || e.repo || e.token)); }

  // Enlace de configuración: la configuración viaja en el fragmento (#cfg=...), que el navegador nunca envía a ningún servidor.
  function configAEnlace(cfg, baseUrl) {
    const o = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, carpeta: cfg.carpeta, token: cfg.token };
    return baseUrl.replace(/#.*$/, '') + '#cfg=' + b64(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function configDeHash(hash) {
    const m = /^#cfg=(.+)$/.exec(hash || ''); if (!m) return null;
    try {
      let t = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '=';
      const o = JSON.parse(deB64(t));
      return (o && typeof o === 'object') ? { owner: String(o.owner || ''), repo: String(o.repo || ''), branch: String(o.branch || 'main'), carpeta: String(o.carpeta || 'proyectos'), token: String(o.token || '') } : null;
    } catch (e) { return null; }
  }
  function ghGuardarConfig(c) { lsSet(K_GH, JSON.stringify(c)); }
  function ghListo() { const c = ghConfig(); return !!(c.owner && c.repo && c.token); }

  function b64(texto) {
    const bytes = new TextEncoder().encode(texto);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function deB64(b) {
    const bin = atob(b.replace(/\n/g, ''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  async function gh(metodo, ruta, cuerpo) {
    const c = ghConfig();
    if (!ghListo()) throw new Error('Falta configurar GitHub (usuario, repositorio y token).');
    const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + ruta, {
      method: metodo,
      headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                 'Content-Type': 'application/json' },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    if (r.status === 204) return null;
    let j = null;
    try { j = await r.json(); } catch (e) { /* sin cuerpo */ }
    if (!r.ok) {
      const err = new Error((j && j.message) || ('Error ' + r.status));
      err.status = r.status;
      if (r.status === 401) err.message = 'El token no es válido o venció (401).';
      if (r.status === 403) err.message = 'GitHub rechazó la operación (403): ' + ((j && j.message) || 'permisos o límite de uso') + '.';
      if (r.status === 404 && /\/contents\//.test(ruta) && metodo === 'GET') err.noExiste = true;
      throw err;
    }
    return j;
  }
  function rutaArchivo(nombreArchivo) {
    const c = ghConfig();
    return (c.carpeta ? c.carpeta.replace(/^\/|\/$/g, '') + '/' : '') + nombreArchivo;
  }
  const encRuta = (p) => p.split('/').map(encodeURIComponent).join('/');
  async function ghListar() {
    const c = ghConfig();
    try {
      const j = await gh('GET', '/contents/' + encRuta(c.carpeta || '') + '?ref=' + encodeURIComponent(c.branch));
      return (Array.isArray(j) ? j : []).filter(f => f.type === 'file' && /\.json$/i.test(f.name))
        .map(f => ({ nombre: f.name, sha: f.sha, path: f.path }));
    } catch (e) { if (e.noExiste) return []; throw e; }
  }
  async function ghLeer(nombreArchivo, ref) {
    const c = ghConfig();
    const j = await gh('GET', '/contents/' + encRuta(rutaArchivo(nombreArchivo)) + '?ref=' + encodeURIComponent(ref || c.branch));
    let texto;
    if (j.content) texto = deB64(j.content);
    else { // archivos > 1 MB: pedir el contenido crudo
      const r = await fetch(j.download_url || '');
      texto = await r.text();
    }
    return { datos: migrar(JSON.parse(texto)), sha: j.sha };
  }
  async function ghGuardar(d, mensaje, forzar) {
    const c = ghConfig();
    if (!d.meta.archivo) d.meta.archivo = slug(d.proyecto.nombre) + '.json';
    const ruta = rutaArchivo(d.meta.archivo);
    let sha = d.meta.sha || '';
    if (!sha || forzar) {
      try { const ex = await gh('GET', '/contents/' + encRuta(ruta) + '?ref=' + encodeURIComponent(c.branch)); sha = ex.sha; }
      catch (e) { if (!e.noExiste) throw e; sha = ''; }
    }
    d.meta.modificado = new Date().toISOString();
    const cuerpo = { message: mensaje || ('Guardar ' + (d.proyecto.nombre || d.meta.archivo)), content: b64(serializar(d)), branch: c.branch };
    if (sha) cuerpo.sha = sha;
    try {
      const j = await gh('PUT', '/contents/' + encRuta(ruta), cuerpo);
      d.meta.sha = j.content.sha;
      return j;
    } catch (e) {
      if (e.status === 409 || e.status === 422) { e.conflicto = true; e.message = 'El archivo cambió en GitHub desde la última vez que lo abriste (otra persona o otro dispositivo lo guardó).'; }
      throw e;
    }
  }
  async function ghHistorial(nombreArchivo) {
    const c = ghConfig();
    const j = await gh('GET', '/commits?path=' + encodeURIComponent(rutaArchivo(nombreArchivo)) + '&sha=' + encodeURIComponent(c.branch) + '&per_page=30');
    return (j || []).map(x => ({ sha: x.sha, mensaje: x.commit.message.split('\n')[0], fecha: x.commit.author.date, autor: x.commit.author.name }));
  }
  async function ghBorrar(nombreArchivo) {
    const c = ghConfig();
    const ruta = rutaArchivo(nombreArchivo);
    const ex = await gh('GET', '/contents/' + encRuta(ruta) + '?ref=' + encodeURIComponent(c.branch));
    return gh('DELETE', '/contents/' + encRuta(ruta), { message: 'Borrar ' + nombreArchivo, sha: ex.sha, branch: c.branch });
  }
  async function ghTraerCatalogo() {
    const c = ghConfig();
    const j = await gh('GET', '/contents/catalogo/materiales.json?ref=' + encodeURIComponent(c.branch));
    let texto = j.content ? deB64(j.content) : await (await fetch(j.download_url)).text();
    return normalizarCatalogo(JSON.parse(texto));
  }

  root.Store = {
    VERSION_DATOS, LISTAS_BASE, nuevoProyecto, migrar, indice, guardarLocal, cargarLocal, borrarLocal, ultimoId, localDisponible,
    guardarListasPorDefecto, slug, serializar, descargar,
    catalogoGuardar, catalogoCargarLocal, normalizarCatalogo, catalogoBuscar, etiquetaCatalogo,
    get catalogo() { return catalogo; },
    ghConfig, ghGuardarConfig, ghListo, ghEmbebida, configAEnlace, configDeHash, catalogoAutomatico, ghListar, ghLeer, ghGuardar, ghHistorial, ghBorrar, ghTraerCatalogo,
  };
})(window);

</script>
<script>
/* =====================================================================
   COMPARAR VERSIONES — diferencias entre dos estados de un proyecto.
   Función pura: recibe dos proyectos (viejo, nuevo) y la descripción de
   las tablas, y devuelve una lista de cambios legibles.
   ===================================================================== */
(function (root) {
  'use strict';
  const CAMPOS_PROYECTO = {
    nombre: 'Nombre', cliente: 'Cliente', fecha: 'Fecha', modoMaterial: 'Modo de material', materialProyecto: 'Material proyecto',
    materialInteriores: 'Material interiores', materialFrentesBajos: 'Material frentes bajos', materialFrentesAlacenas: 'Material frentes alacenas',
    observaciones: 'Observaciones',
  };
  const ARRAYS = ['modulos', 'puertas', 'cajones', 'overrides', 'sueltas', 'tapacantos'];
  const vacio = (v) => v === undefined || v === null || v === '';
  const mostrar = (v) => vacio(v) ? '(vacío)' : (v === true ? 'sí' : v === false ? 'no' : String(v));
  const igual = (a, b) => (vacio(a) && vacio(b)) || String(a) === String(b);

  // tablas: { modulos: { titulo, cols: [{k, t}] }, ... }  (las de la interfaz)
  function comparar(viejo, nuevo, tablas) {
    const cambios = [];
    const add = (tipo, seccion, texto) => cambios.push({ tipo, seccion, texto }); // tipo: '+', '-', '~'

    Object.keys(CAMPOS_PROYECTO).forEach(k => {
      const a = (viejo.proyecto || {})[k], b = (nuevo.proyecto || {})[k];
      if (!igual(a, b)) add('~', 'Proyecto', CAMPOS_PROYECTO[k] + ': ' + mostrar(a) + ' → ' + mostrar(b));
    });

    ARRAYS.forEach(tk => {
      const T = (tablas && tablas[tk]) || { titulo: tk, cols: [] };
      const cols = T.cols.filter(c => c.k && c.k[0] !== '_');
      const nombreCol = (k) => { const c = cols.find(x => x.k === k); return c ? c.t : k; };
      const idDe = (r) => String(tk === 'modulos' ? r.id : r.idModulo).trim();
      const agrupar = (lista) => { const g = {}, ord = []; (lista || []).forEach(r => { const id = idDe(r); if (!g[id]) { g[id] = []; ord.push(id); } g[id].push(r); }); return { g, ord }; };
      const A = agrupar(viejo[tk]), B = agrupar(nuevo[tk]);
      const ids = A.ord.concat(B.ord.filter(i => A.ord.indexOf(i) < 0));
      const etiqueta = (id) => tk === 'modulos' ? ('Módulo ' + id) : (id ? ('Módulo ' + id) : 'Sin módulo');
      const resumenFila = (r) => cols.filter(c => c.k !== 'idModulo' && c.k !== 'id' && !vacio(r[c.k]) && r[c.k] !== false).map(c => nombreCol(c.k) + ' ' + mostrar(r[c.k])).join(', ');
      ids.forEach(id => {
        const fa = A.g[id] || [], fb = B.g[id] || [];
        if (tk === 'modulos' && !fa.length) { add('+', T.titulo, 'Se agregó el módulo ' + id + (fb[0].tipo ? ' (' + fb[0].tipo + ', ' + [fb[0].h, fb[0].l, fb[0].p].map(mostrar).join(' × ') + ')' : '')); return; }
        if (tk === 'modulos' && !fb.length) { add('-', T.titulo, 'Se quitó el módulo ' + id + (fa[0].tipo ? ' (' + fa[0].tipo + ')' : '')); return; }
        const n = Math.max(fa.length, fb.length);
        for (let i = 0; i < n; i++) {
          const ra = fa[i], rb = fb[i];
          const sec = T.titulo + ' · ' + etiqueta(id) + (n > 1 && tk !== 'modulos' ? ' (#' + (i + 1) + ')' : '');
          if (!ra) { add('+', T.titulo, etiqueta(id) + ': se agregó ' + (resumenFila(rb) || 'una fila')); continue; }
          if (!rb) { add('-', T.titulo, etiqueta(id) + ': se quitó ' + (resumenFila(ra) || 'una fila')); continue; }
          cols.forEach(c => {
            if (c.k === 'idModulo' || (tk === 'modulos' && c.k === 'id')) return;
            if (!igual(ra[c.k], rb[c.k])) add('~', T.titulo, (tk === 'modulos' ? 'Módulo ' + id : sec) + ': ' + nombreCol(c.k) + ' ' + mostrar(ra[c.k]) + ' → ' + mostrar(rb[c.k]));
          });
        }
      });
    });
    return cambios;
  }
  const api = { comparar, CAMPOS_PROYECTO };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Diff = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   PDF DE ETIQUETAS — generador mínimo, sin librerías.
   Una página A4 con 3 × 7 etiquetas, pie con proyecto / fecha / página.
   Fuente Helvetica (incluida en todo visor de PDF), codificación WinAnsi.
   ===================================================================== */
(function (root) {
  'use strict';

  /* ------------------------------------------------------------------ render de tablas editables */
  function celdaHtml(tk, i, c, row) {
    const key = tk + ':' + i + ':' + c.k;

    const dis = c.dis && c.dis(row) ? ' disabled' : '';

    switch (c.tipo) {
      case 'text': return '<td><input data-k="' + key + '" value="' + esc(val) + '"' + dis + (c.ancho ? ' style="width:' + c.ancho + 'px"' : '') + '></td>';
      case 'num': return '<td class="num"><input type="number" inputmode="decimal" step="any" data-k="' + key + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + dis + '></td>';
      case 'chk': return '<td class="chk"><input type="checkbox" data-k="' + key + '"' + (val !== false ? ' checked' : '') + '></td>';
      case 'dl': return '<td><input list="dl-mat" data-k="' + key + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + dis + ' style="min-width:120px"></td>';
      case 'cat': return '<td><input class="cat" data-cat="' + c.cat + '" data-k="' + key + '" value="' + esc(val) + '" placeholder="buscar…" autocomplete="off"' + w + '></td>';
      case 'aviso': { const a = avisoTapacanto(row); return '<td title="' + esc(a) + '" style="color:var(--warn);cursor:help;width:24px">' + (a ? '⚠' : '') + '</td>'; }
      case 'sel': {
        let opts = c.opts(row).map(o => (typeof o === 'object') ? o : { v: o, l: o });
        const actual = (val === undefined || val === null) ? '' : val;
        const hay = opts.some(o => String(o.v) === String(actual));
        let html = '<option value="">' + esc(c.vacio || '') + '</option>';
        if (actual !== '' && !hay) html += '<option value="' + esc(actual) + '" selected>' + esc(actual) + ' (no existe)</option>';
        html += opts.map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(actual) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('');
        return '<td><select data-k="' + key + '"' + dis + w + '>' + html + '</select></td>';
      }
    }
    return '<td></td>';
  }
