  function tapsHtml(p) { return '<td class="n">' + esc(p.tapLargo) + '</td><td class="n">' + esc(p.tapAncho) + '</td>'; }
  // Clave de una pieza para marcarla como cortada: si cambia su medida, la marca se pierde (es otra pieza).
  function claveCorte(idMod, p) { return [idMod, p.nombreBase, p.largo, p.ancho, p.espesor].join('|'); }
  function estaCortada(idMod, p) { return !!(D.cortadas && D.cortadas[claveCorte(idMod, p)]); }
  function filaPiezaTaller(p, idMod) {
    const k = claveCorte(idMod, p), hecha = !!(D.cortadas && D.cortadas[k]);
    return '<tr' + (hecha ? ' class="cortada"' : '') + '><td class="n chk"><input type="checkbox" data-cut="' + esc(k) + '"' + (hecha ? ' checked' : '') + ' title="Marcar como cortada"></td><td>' + esc(p.nombreBase) + '</td>' + (p.material ? '<td class="mat">' + esc(p.material) + '</td>' : '<td class="mat sin">–</td>') +
      '<td class="n">' + p.cantidad + '</td><td class="n">' + p.largo + '</td><td class="n">' + p.ancho + '</td><td class="n">' + p.espesor + '</td>' + tapsHtml(p) + '</tr>';
  }
  const THEAD_TALLER = '<thead><tr><th class="n">✓</th><th>Pieza</th><th>Material</th><th class="n">Cant.</th><th class="n">L</th><th class="n">A</th><th class="n">E</th><th class="n">T.L.</th><th class="n">T.A.</th></tr></thead>';
  function piezasTaller() {
    const out = [];
    R.orden.modulos.forEach(m => m.piezas.forEach(p => out.push({ id: m.idModulo, grupo: m.idModulo, p, mat: p.material || m.material || '' })));
    R.orden.secciones.forEach(s => s.piezas.forEach(p => out.push({ id: '§' + s.categoria, grupo: s.categoria, p, mat: p.material || '' })));
    return out;
  }

  function hayBusqueda() { return busq.largo !== '' || busq.ancho !== '' || busq.espesor !== ''; }
  function clasificar(piezas) {
    const b = { largo: busq.largo === '' ? null : Number(busq.largo), ancho: busq.ancho === '' ? null : Number(busq.ancho), espesor: busq.espesor === '' ? null : Number(busq.espesor) };
    const ex = [], ap = [];
    piezas.forEach(p => {
      const campos = [];
      if (b.largo !== null) campos.push([num(p.largo), b.largo]);
      if (b.ancho !== null) campos.push([num(p.ancho), b.ancho]);
      if (b.espesor !== null) campos.push([num(p.espesor), b.espesor]);
      if (!campos.length) return;
      let inc = true, exacta = true;
      campos.forEach(([a, c]) => { const d = Math.abs(a - c); if (d > 1) inc = false; if (d > 0) exacta = false; });
      if (inc) (exacta ? ex : ap).push(p);
    });
    return { ex, ap };
  }
  function bloqueBusqueda(planas, titulo) {
    const r = clasificar(planas);
    const filas = (l) => l.map(p => '<div class="pieza-row"><span><strong>' + esc(p.titulo) + '</strong> · ' + esc(p.detalle) + '</span><span class="q">' + (p.cantidad > 1 ? 'x' + p.cantidad : '') + '</span></div>').join('');
    let h = '';
    if (r.ex.length) h += '<div class="modulo-card"><div class="modulo-titulo">Coincidencias exactas</div>' + filas(r.ex) + '</div>';
    if (r.ap.length) h += '<div class="modulo-card"><div class="modulo-titulo" style="color:var(--warn)">Aproximados (±1 mm)</div>' + filas(r.ap) + '</div>';
    return h || '<div class="vacio">Ninguna pieza coincide con esa medida.</div>';
  }
  function cajaBusqueda() {
    return '<div class="card no-print"><div class="barra" style="margin-bottom:2px"><label class="l" style="margin:0">Buscar por medida (mm)</label><a href="#" data-acc="limpiar-busq" style="font-size:12px;color:#A9B08F;font-weight:600;text-decoration:none">Limpiar</a></div>' +
      '<p class="hint">Dejá en blanco lo que no quieras filtrar — además de la coincidencia exacta, se arma una sección aparte con lo que está a ±1 mm.</p>' +
      '<div class="row3"><input type="number" data-busq="largo" placeholder="Largo" value="' + esc(busq.largo) + '"><input type="number" data-busq="ancho" placeholder="Ancho" value="' + esc(busq.ancho) + '"><input type="number" data-busq="espesor" placeholder="Espesor" value="' + esc(busq.espesor) + '"></div></div>';
  }
  function titlebar(titulo) {
    return '<div class="print-titlebar"><span>' + esc(titulo) + '</span><span>' + (D.proyecto.nombre ? 'Proyecto: ' + esc(D.proyecto.nombre) : '') + (D.proyecto.fecha ? '   ·   Fecha: ' + esc(fechaCorta(D.proyecto.fecha)) : '') + '</span></div>';
  }

  /* ---- Etiquetas (PDF directo) ---- */
  function listaEtiquetas(soloPendientes) {
    const out = [];
    const proy = D.proyecto.nombre || '';
    piezasTaller().forEach(x => {
      if (soloPendientes && estaCortada(x.id, x.p)) return;
      const p = x.p, n = Math.max(1, num(p.cantidad));
      const med = [p.largo, p.ancho, p.espesor].filter(v => v !== '' && v !== undefined && v !== null).join(' × ');
      const tl = String(p.tapLargo), ta = String(p.tapAncho), conCanto = (tl !== '-' && tl !== '') || (ta !== '-' && ta !== '');
      for (let i = 1; i <= n; i++) out.push({ id: x.grupo, pieza: p.nombreBase, medidas: med, material: x.mat || '', canto: conCanto ? 'Canto · L: ' + tl + ' · A: ' + ta : '', proyecto: proy, n: i, total: n });
    });
    return out;
  }
  async function imprimirEtiquetas() {
    if (!R || !R.ok) { toast('Primero resolvé los errores del despiece para poder imprimir etiquetas.', 'err'); return; }
    const todas = listaEtiquetas(false);
    if (!todas.length) { toast('Todavía no hay piezas para etiquetar.', 'err'); return; }
    const pend = listaEtiquetas(true);
    let lista = todas;
    if (pend.length !== todas.length) {
      const r = await new Promise((res) => {
        const dlg = dialogo('<h3>Imprimir etiquetas</h3><p style="font-size:13.5px;line-height:1.5">Hay ' + (todas.length - pend.length) + ' pieza(s) marcadas como cortadas. ¿Qué etiquetas querés?</p><div class="pie-d"><button class="sec" data-r="x">Cancelar</button><button class="sec" data-r="todas">Todas (' + todas.length + ')</button><button data-r="pend">Sólo las que faltan (' + pend.length + ')</button></div>');
        let v = 'x';
        dlg.addEventListener('click', (e) => { const b = e.target.closest('button[data-r]'); if (b) { v = b.dataset.r; dlg.close(); } });
        dlg.addEventListener('close', () => res(v));
      });
      if (r === 'x') return;
      if (r === 'pend') lista = pend;
    }
    if (!lista.length) { toast('No quedan piezas pendientes: todas están marcadas como cortadas.'); return; }
    try {
      const bytes = window.PdfEtiquetas.generar({ titulo: 'Etiquetas · ' + (D.proyecto.nombre || ''), pie: textoPie(), etiquetas: lista });
      St.descargar(St.slug(D.proyecto.nombre) + '-etiquetas.pdf', bytes, 'application/pdf');
      toast('PDF de etiquetas generado (' + lista.length + ' etiquetas)', 'ok');
    } catch (e) { toast('No se pudo generar el PDF: ' + e.message, 'err'); }
  }

  /* ---- Taller: por módulo (con marcas de corte) o agrupado (ex pestaña Piezas) ---- */
  const VISTAS_TALLER = [['modulo', 'Por módulo'], ['pieza', 'Tipo de pieza'], ['material', 'Material'], ['tipoPuerta', 'Tipo de puerta'], ['cortePuerta', 'Corte de puerta'], ['ambiente', 'Ambiente'], ['cajonFondo', 'Espesor de fondo de cajón'], ['modulos', 'Resumen de módulos']];
  function categoriaPieza(p) { return p.categoria || p.pieza || 'Sin pieza'; }

  function vistaTallerTab() {
    if (!R || !R.ok) return sinResultado();
    const todas = piezasTaller();
    const total = todas.reduce((s, x) => s + num(x.p.cantidad), 0), hechas = todas.reduce((s, x) => s + (estaCortada(x.id, x.p) ? num(x.p.cantidad) : 0), 0);
    if (agruparPor === 'pieza') { const ex = new Set(R.taller.map(categoriaPieza)); if (subPieza && !ex.has(subPieza)) subPieza = ''; }
    const cats = Array.from(new Set(R.taller.map(categoriaPieza))).sort((a, b) => a.localeCompare(b, 'es'));
    let h = '<div class="card no-print barra"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<label class="l" style="margin:0">Ver por</label><select data-agrupar style="width:auto;min-width:200px"' + (hayBusqueda() && agruparPor !== 'modulo' ? ' disabled' : '') + '>' + VISTAS_TALLER.map(o => '<option value="' + o[0] + '"' + (agruparPor === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
      (agruparPor === 'pieza' ? '<label class="l" style="margin:0">Pieza</label><select data-subpieza style="width:auto;min-width:170px"><option value="">Todas</option>' + cats.map(c => '<option value="' + esc(c) + '"' + (subPieza === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' : '') + '</div>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      (agruparPor === 'modulo' ? '<span class="chip" title="Piezas marcadas como cortadas">Cortadas: ' + hechas + ' de ' + total + '</span><label style="font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-oc' + (ocultarCortadas ? ' checked' : '') + '> Ocultar cortadas</label>' + (hechas ? '<button class="sec mini" data-acc="cut-clear">Limpiar marcas</button>' : '')
        : '<span class="chip">' + R.taller.length + ' combinaciones · ' + R.taller.reduce((s, p) => s + p.cantidad, 0) + ' piezas</span>') +
      '<button data-acc="print">🖨 Imprimir</button></div></div>';
    h += cajaBusqueda();
    if (agruparPor !== 'modulo') return h + vistaAgrupada();
    h += titlebar('LISTA DE TALLER');
    const mods = R.orden.modulos, secs = R.orden.secciones;
    if (!mods.length && !secs.length) return h + '<div class="card vacio">Todavía no hay módulos. Cargalos en la pestaña “Módulos”.</div>';
    if (hayBusqueda()) {
      const planas = [];
      mods.forEach(m => m.piezas.forEach(p => planas.push({ titulo: m.idModulo + ' · ' + p.nombreBase, detalle: [p.material || m.material, [p.largo, p.ancho, p.espesor].filter(Boolean).join(' × ')].filter(Boolean).join(' · '), cantidad: p.cantidad, largo: p.largo, ancho: p.ancho, espesor: p.espesor })));
      secs.forEach(s => s.piezas.forEach(p => planas.push({ titulo: s.categoria + ' · ' + p.nombreBase, detalle: [p.material, [p.largo, p.ancho, p.espesor].filter(Boolean).join(' × ')].filter(Boolean).join(' · '), cantidad: p.cantidad, largo: p.largo, ancho: p.ancho, espesor: p.espesor })));
      return h + bloqueBusqueda(planas);
    }
    const visibles = (lista, id) => ocultarCortadas ? lista.filter(p => !estaCortada(id, p)) : lista;
    const bloqueMod = (id, titulo, sub, piezas, estiloTitulo) => {

      const hechasMod = piezas.filter(p => estaCortada(id, p)).length;
      return '<div class="modulo-card"><div class="modulo-titulo"' + (estiloTitulo ? ' style="' + estiloTitulo + '"' : '') + '><span>' + esc(titulo) + '</span><button class="sec mini no-print" data-acc="cut-mod" data-id="' + esc(id) + '" title="Marcar o desmarcar todas las piezas de este módulo">' + (hechasMod === piezas.length ? 'Desmarcar todas' : 'Marcar todas') + '</button></div>' +
        (sub ? '<div class="modulo-sub">' + esc(sub) + '</div>' : '') + '<div class="tabla-wrap"><table class="tabla-corte">' + THEAD_TALLER + '<tbody>' + ps.map(p => filaPiezaTaller(p, id)).join('') + '</tbody></table></div></div>';
    };
    h += mods.map(m => bloqueMod(m.idModulo, m.idModulo, [m.tipo, m.material, m.h + ' x ' + m.l + ' x ' + m.p, m.observaciones].filter(Boolean).join(' · '), m.piezas)).join('');
    h += secs.map(s => bloqueMod('§' + s.categoria, 'Sección: ' + s.categoria, '', s.piezas, 'color:var(--madera)')).join('');
    if (ocultarCortadas && h.indexOf('modulo-card') < 0) h += '<div class="card vacio">Todas las piezas están marcadas como cortadas. 🎉</div>';
    return h;
  }


  function sinResultado() {
    return '<div class="card"><div class="vacio">' + esc(R ? R.mensaje : 'Sin datos') + '</div></div>';
  }

  /* ---- Fichas: lista de módulos + todo lo de un módulo en una sola pantalla ---- */
  function avisosDeModulo(id) {
    if (!R || !R.ok) return [];
    return R.avisos.filter(a => { const d = destinoAviso(a); return d && d.id === id; });
  }
  function resumenAviso(a) {
    if (/no tiene puertas/.test(a)) return 'falta puerta';
    if (/no tiene cajones/.test(a)) return 'faltan cajones';
    if (/repetido/.test(a)) return 'ID repetido';
    return 'revisar aviso';
  }
  function medidaPuerta(r) {
    const m = moduloPorId(String(r.idModulo).trim());
    let largo = r.largo, ancho = r.ancho;
    if (r.corte in M.PUERTA_OFFSETS) {
      if (m && num(m.h)) largo = Math.round(num(m.h) + M.PUERTA_OFFSETS[r.corte]);
      if (r.modalidad === 'Simetrica' && m && num(m.l) > 0) ancho = Math.round(M.calcularAnchoSimetrico_(num(m.l), num(r.cant) || 1));
    }
    return (largo && ancho) ? (Math.round(num(largo)) + ' × ' + Math.round(num(ancho))) : '';
  }
  function interiorCelda(tk, i, c, row) { return celdaHtml(tk, i, c, row).replace(/^<td[^>]*>/, '').replace(/<\/td>$/, ''); }
  function campoFicha(tk, i, c, row) { return '<div class="campo"><label class="l">' + esc(c.t) + '</label>' + interiorCelda(tk, i, c, row) + '</div>'; }

  // Mini tabla de una sección de la ficha: las mismas columnas y los mismos data-k que las pestañas de tablas.
  function seccionFicha(titulo, tk, id, textoAdd, opt) {
    opt = opt || {};
    const T = TABLAS[tk];
    const filas = [];
    D[T.arr].forEach((row, i) => { if (String(row.idModulo || '').trim() === id) filas.push({ row, i }); });
    const cols = T.cols.filter(c => c.k !== 'idModulo');
    const head = cols.map(c => '<th>' + esc(c.t) + '</th>').join('') + (opt.extraTh ? '<th>' + opt.extraTh + '</th>' : '') + '<th></th>';
    const cuerpo = filas.map(({ row, i }) => '<tr>' + cols.map(c => celdaHtml(tk, i, c, row)).join('') + (opt.extraTd ? '<td class="ro">' + opt.extraTd(row) + '</td>' : '') +
      '<td class="acc"><button class="sec ico" data-acc="f-dup" data-t="' + tk + '" data-i="' + i + '" title="Duplicar fila">⧉</button> <button class="peligro ico" data-acc="f-del" data-t="' + tk + '" data-i="' + i + '" title="Borrar fila">✕</button></td></tr>').join('');
    const cab = '<h4>' + esc(titulo) + (filas.length ? ' <span class="chip">' + filas.length + '</span>' : '') + '</h4>' + (opt.ayuda ? '<p class="hint" style="margin:0 0 8px">' + esc(opt.ayuda) + '</p>' : '');
    const cierre = '<button class="sec mini" data-acc="f-add" data-t="' + tk + '" style="margin-top:8px">' + esc(textoAdd) + '</button>';
    const cuerpoHtml = (filas.length ? '<div class="tabla-wrap"><table class="t"><thead><tr>' + head + '</tr></thead><tbody>' + cuerpo + '</tbody></table></div>' : '') + cierre;
    if (opt.plegable) return '<details class="fsec"' + (filas.length ? ' open' : '') + '><summary>' + cab.replace(/^<h4>/, '<span>').replace(/<\/h4>/, '</span>') + '</summary>' + cuerpoHtml + '</details>';
    return '<div class="fsec">' + cab + cuerpoHtml + '</div>';
  }

  // Tapacantos dentro de la ficha: una tarjeta por pieza, todos los datos a la vista sin recorrer horizontalmente.
  function seccionTapacantos(id) {
    const T = TABLAS.tapacantos, filas = [];
    D[T.arr].forEach((row, i) => { if (String(row.idModulo || '').trim() === id) filas.push({ row, i }); });
    const c = (k) => T.cols.find(x => x.k === k);
    const tarjetas = filas.map(({ row, i }) => {
      const av = avisoTapacanto(row);
      const f = (k, etiqueta) => '<div class="campo"><label class="l">' + esc(etiqueta || c(k).t) + '</label>' + interiorCelda('tapacantos', i, c(k), row) + '</div>';
      return '<div class="tcard"><div class="tc-top"><div class="tc-pieza">' + f('pieza') + '</div><div class="tc-cant">' + f('cantidad') + '</div>' +
        '<div class="tc-acc"><button class="sec ico" data-acc="f-dup" data-t="tapacantos" data-i="' + i + '" title="Duplicar">⧉</button> <button class="peligro ico" data-acc="f-del" data-t="tapacantos" data-i="' + i + '" title="Borrar">✕</button></div></div>' +
        '<div class="tc-lados"><label class="l" style="margin:0">Lados con canto</label>' + f('arr') + f('ab') + f('izq') + f('der') + '</div>' +
        '<div class="tc-mat">' + f('materialPlaca') + f('tapPrincipal') + f('tapSecundario') + '</div>' +
        (av ? '<div class="tc-aviso">⚠ ' + esc(av) + '</div>' : '') + '</div>';
    }).join('');
    return '<details class="fsec"' + (filas.length ? ' open' : '') + '><summary><span>Enviar piezas al proveedor (Tapacantos)' + (filas.length ? ' <span class="chip">' + filas.length + '</span>' : '') + '</span></summary>' +
      '<p class="hint" style="margin:0 0 8px">Elegí la pieza y los lados con canto. <strong>Cant. a enviar</strong>: cuántas piezas de ese tipo van al proveedor; vacío = todas las que haya.</p>' + tarjetas +
      '<button class="sec mini" data-acc="f-add" data-t="tapacantos" style="margin-top:6px">+ Tapacanto</button></details>';
  }

  function vistaFicha() {
    if (!D.modulos.length) {
      return '<div class="card"><h2>Fichas de módulos</h2><p class="hint">Cada módulo con todo lo suyo en una sola pantalla: medidas, puertas, cajones, excepciones de material y piezas sueltas, con las piezas calculándose a medida que escribís.</p><div class="vacio">Todavía no hay módulos.</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button data-acc="f-nuevo">+ Módulo</button><button class="sec" data-acc="tipo-nuevo">+ Módulo tipo</button></div></div>';
    }
    if (!moduloPorId(fichaSel)) fichaSel = String(D.modulos[0].id).trim();
    const id = fichaSel, idx = D.modulos.findIndex(m => String(m.id).trim() === id), m = D.modulos[idx];
    // lista de la izquierda, agrupada por ambiente
    const grupos = {}, orden = [];
    D.modulos.forEach(x => { const a = x.ambiente || '(sin ambiente)'; if (!grupos[a]) { grupos[a] = []; orden.push(a); } grupos[a].push(x); });
    const lista = orden.map(a => '<div class="f-amb">' + esc(a) + ' · ' + grupos[a].length + ' módulo' + (grupos[a].length > 1 ? 's' : '') + '</div>' + grupos[a].map(x => {
      const xid = String(x.id).trim(), av = avisosDeModulo(xid);
      const sub = av.length ? '<span class="f-warn">' + esc(resumenAviso(av[0])) + '</span>' : esc([x.tipo, [x.l, x.h].filter(Boolean).length === 2 ? (x.h + '×' + x.l) : ''].filter(Boolean).join(' '));
      return '<div class="f-mod' + (xid === id ? ' on' : '') + '" data-ficha="' + esc(xid) + '"><b><span class="dot ' + (av.length ? 'w' : 'ok') + '"></span>' + esc(xid || '(sin ID)') + '</b><span>' + sub + '</span></div>';
    }).join('')).join('');

    const camposMod = TABLAS.modulos.cols;
    const col = (k) => camposMod.find(c => c.k === k);
    const campo = (k) => campoFicha('modulos', idx, col(k), m);
    const av = avisosDeModulo(id);
    const avHtml = av.length ? '<div class="avisos" style="margin:0 0 10px"><ul style="margin:0">' + av.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul></div>' : '';

    const cabecera = '<div class="fsec"><div class="row-f" style="margin-bottom:10px"><strong style="font-size:16px;color:var(--crema)">' + esc(id) + '</strong><span class="chip">' + esc(m.ambiente || '—') + '</span><span class="chip">' + esc(m.tipo || '—') + '</span>' +
      '<span style="flex:1"></span><button class="sec mini" data-acc="f-tipo-guardar" title="Guardar este módulo como plantilla">☆ Guardar como tipo</button><button class="peligro mini" data-acc="f-borrar-mod">Borrar módulo</button></div>' + avHtml +
      '<div class="fgrid">' + campo('ambiente') + campo('id') + campo('tipo') + campo('h') + campo('l') + campo('p') + campo('eMovil') + campo('eFijo') + campo('pteExtra') + campo('material') +
      '<div class="campo"><label class="l">Fondo</label>' + interiorCelda('modulos', idx, col('fondo'), m) + '</div></div>' +
      '<div class="campo" style="margin-top:8px"><label class="l">Observaciones</label>' + interiorCelda('modulos', idx, col('observaciones'), m) + '</div></div>';

    const cat = M.CATALOGO[m.tipo] || {};
    const hayCajones = D.cajones.some(r => String(r.idModulo).trim() === id);
    const sPuertas = seccionFicha('Puertas', 'puertas', id, '+ Puerta', { extraTh: 'Medida', extraTd: (r) => { const t = medidaPuerta(r); return t ? '<span class="pill-f">' + esc(t) + '</span>' : ''; }, ayuda: cat.puertaObligatoria ? 'Este tipo de módulo lleva puertas.' : '' });
    const sCajones = (cat.cajonera || hayCajones) ? seccionFicha('Cajones', 'cajones', id, '+ Cajón') : '';
    const sOver = seccionFicha('Material distinto en alguna pieza', 'overrides', id, '+ Excepción');
    const sSueltas = seccionFicha('Piezas sueltas de este módulo', 'sueltas', id, '+ Pieza');
    const sTap = seccionTapacantos(id);

    // piezas calculadas en vivo
    let vivo = '';
    if (!R || !R.ok) vivo = '<div class="vacio">' + esc(R ? R.mensaje : '') + '</div>';
    else {
      const bm = R.orden.modulos.find(x => x.idModulo === id);
      const prov = R.proveedor.filter(f => f.idModulo === id).reduce((s, f) => s + num(f.cantidad), 0);
      vivo = bm && bm.piezas.length ? '<div class="tabla-wrap"><table class="tabla-corte"><thead><tr><th>Pieza</th><th>Material</th><th class="n">Cant.</th><th class="n">L</th><th class="n">A</th><th class="n">E</th><th class="n">T.L.</th><th class="n">T.A.</th></tr></thead><tbody>' +
        bm.piezas.map(p => '<tr><td>' + esc(p.nombreBase) + '</td>' + ((p.material || bm.material) ? '<td class="mat">' + esc(p.material || bm.material) + '</td>' : '<td class="mat sin">–</td>') + '<td class="n">' + p.cantidad + '</td><td class="n">' + p.largo + '</td><td class="n">' + p.ancho + '</td><td class="n">' + p.espesor + '</td>' + tapsHtml(p) + '</tr>').join('') + '</tbody></table></div>'
        : '<div class="vacio">Este módulo todavía no genera piezas. Completá tipo, H, L y P.</div>';
      if (prov) vivo += '<p class="hint" style="margin:8px 0 0">Además, ' + prov + ' pieza(s) de este módulo van al proveedor (no figuran arriba).</p>';
    }
    const sVivo = '<div class="fsec"><h4>Así va saliendo <span class="hint" style="font-weight:400">(se actualiza al escribir)</span></h4>' + vivo + '</div>';

    return '<div class="ficha"><div class="f-lista"><div class="f-botones"><button data-acc="f-nuevo">+ Módulo</button><button class="sec" data-acc="tipo-nuevo">+ Módulo tipo</button><button class="sec" data-acc="f-duplicar">Duplicar ' + esc(id) + ' ×…</button></div>' + lista + '</div>' +
      '<div class="f-detalle">' + cabecera + sPuertas + sCajones + sOver + sSueltas + sTap + sVivo + '</div></div>';
  }

  function duplicarModulo(id, n) {
    const src = moduloPorId(id); if (!src) return [];
    const nuevos = [];
    for (let k = 0; k < n; k++) {
      const m = JSON.parse(JSON.stringify(src));
      m.id = M.siguienteId(D.modulos, m.ambiente, codigoAmbiente(m.ambiente), null);
      D.modulos.push(m); nuevos.push(m.id);
      ['puertas', 'cajones', 'overrides', 'sueltas', 'tapacantos'].forEach(tk => D[tk].filter(r => String(r.idModulo).trim() === id).forEach(r => { const c = JSON.parse(JSON.stringify(r)); c.idModulo = m.id; D[tk].push(c); }));
    }
    return nuevos;
  }

  /* ---- Agrupaciones (ex pestaña Piezas) ---- */
  function vistaAgrupada() {
    const TODAS = R.taller;
    const ambPorId = {}; D.modulos.forEach(m => ambPorId[String(m.id).trim()] = m.ambiente);
    let h = titlebar('PIEZAS · ' + (VISTAS_TALLER.find(v => v[0] === agruparPor) || [0, ''])[1]);
    if (!TODAS.length) return h + '<div class="card vacio">Todavía no hay piezas.</div>';
    const etiqueta = (p) => [p.pieza, p.cortePuerta, p.tipoPuerta].filter(Boolean).join(' · ');
    if (hayBusqueda()) {
      return h + bloqueBusqueda(TODAS.map(p => ({ titulo: etiqueta(p), detalle: [p.material, [p.largo, p.ancho, p.espesor].filter(Boolean).join(' × '), p.modulos].filter(Boolean).join(' · '), cantidad: p.cantidad, largo: p.largo, ancho: p.ancho, espesor: p.espesor })));
    }
    if (agruparPor === 'modulos') {
      const porTipo = {}; D.modulos.forEach(m => { if (m.tipo) porTipo[m.tipo] = (porTipo[m.tipo] || 0) + 1; });
      const sueltas = TODAS.filter(p => !p.modulos || p.modulos === '-').reduce((s, p) => s + p.cantidad, 0);
      return h + '<div class="card"><h2>Módulos del proyecto</h2>' + Object.keys(porTipo).sort((a, b) => a.localeCompare(b, 'es')).map(t => '<div class="pieza-row"><span>' + esc(t) + '</span><span class="q">x' + porTipo[t] + '</span></div>').join('') +
        '<h2 style="margin-top:14px">Sin módulo</h2><div class="pieza-row"><span>Piezas sueltas</span><span class="q">x' + sueltas + '</span></div></div>';
    }
    let items = TODAS;
    if (agruparPor === 'pieza' && subPieza) items = TODAS.filter(p => categoriaPieza(p) === subPieza);
    if (agruparPor === 'tipoPuerta') items = TODAS.filter(p => p.tipoPuerta);
    if (agruparPor === 'cortePuerta') items = TODAS.filter(p => p.cortePuerta);
    if (agruparPor === 'cajonFondo') items = TODAS.filter(p => p.pieza === 'Fondo de cajón');
    if (!items.length) return h + '<div class="card vacio">Ninguna pieza cargada tiene este dato todavía.</div>';
    const claves = (p) => {
      if (agruparPor === 'material') return [p.material || 'Sin material'];
      if (agruparPor === 'tipoPuerta') return [p.tipoPuerta];
      if (agruparPor === 'cortePuerta') return [p.cortePuerta];
      if (agruparPor === 'cajonFondo') return [p.espesor ? 'Fondo ' + p.espesor + ' mm' : 'Sin espesor'];
      if (agruparPor === 'ambiente') { const id = String(p.modulos || '').trim(); return [(!id || id === '-') ? 'Sin módulo' : (ambPorId[id] || 'Sin ambiente')]; }
      return [p.categoria || p.pieza || 'Sin pieza'];
    };
    const grupos = {}, orden = [];
    items.forEach(p => claves(p).forEach(k => { if (!grupos[k]) { grupos[k] = []; orden.push(k); } grupos[k].push(p); }));
    orden.sort((a, b) => a.localeCompare(b, 'es'));
    return h + orden.map(k => {
      const its = grupos[k], sub = its.reduce((s, p) => s + p.cantidad, 0);
      let extra = '', encab = '<span style="font-size:11px;color:var(--mute2)">x' + sub + '</span>';
      if (agruparPor === 'ambiente') {
        const mods = D.modulos.filter(m => m.ambiente === k), pt = {};
        mods.forEach(m => pt[m.tipo] = (pt[m.tipo] || 0) + 1);
        encab = '<span style="font-size:11px;color:var(--mute2)">Módulos x' + mods.length + ' · Piezas x' + sub + '</span>';
        if (mods.length) extra = '<div style="margin-bottom:10px"><div class="hint" style="margin:0 0 4px;text-transform:uppercase">Módulos</div>' + Object.keys(pt).sort((a, b) => a.localeCompare(b, 'es')).map(t => '<div class="pieza-row"><span>' + esc(t) + '</span><span class="q">x' + pt[t] + '</span></div>').join('') + '<div class="hint" style="margin:8px 0 0;text-transform:uppercase">Piezas</div></div>';
      }
      const filas = its.map(p => {
        const medida = [p.largo, p.ancho, p.espesor].filter(Boolean).join(' × ');
        const tap = (p.tapLargo || p.tapAncho) ? p.tapLargo + ' en Largo, ' + p.tapAncho + ' en Ancho' : '';
        const det = []; if (agruparPor !== 'material' && p.material) det.push(p.material); if (medida) det.push(medida); if (tap) det.push(tap); if (p.modulos && p.modulos !== '-') det.push(p.modulos);
        return '<div class="pieza-row"><span><strong>' + esc(etiqueta(p)) + '</strong> · ' + esc(det.join(' · ')) + '</span><span class="q">x' + p.cantidad + '</span></div>';
      }).join('');
      return '<div class="card"><div class="barra" style="margin-bottom:8px"><h2 style="margin:0">' + esc(k) + '</h2>' + encab + '</div>' + extra + filas + '</div>';
    }).join('');
  }

  /* ---- Proveedores ---- */
  function vistaProveedores() {
    if (!R || !R.ok) return sinResultado();
    const P = R.proveedor;
    let h = '<div class="card"><div class="barra"><div><h2>Piezas para el proveedor (Dilegno) <span class="chip">' + P.length + '</span></h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sec mini" data-acc="prov-csv">Descargar CSV</button><button class="sec mini" data-acc="prov-json">Descargar JSON</button></div></div>' +
      '<p class="hint">Son las piezas cargadas en “Tapacantos”: no están en la lista de corte del taller. El JSON trae los ids del catálogo (campo “etiqueta”) para armar la exportación.</p>';
    h += P.length ? '<div class="tabla-wrap"><table class="tabla-corte"><thead><tr><th>ID Módulo</th><th>Pieza</th><th>Material</th><th>Material placa</th><th>Tap. principal</th><th>Tap. secundario</th><th>L</th><th>A</th><th>E</th><th>Cant.</th><th>Arr.</th><th>Ab.</th><th>Izq.</th><th>Der.</th></tr></thead><tbody>' +
      P.map(f => '<tr><td>' + esc(f.idModulo) + '</td><td>' + esc(f.pieza) + '</td><td class="mat">' + esc(f.material) + '</td><td>' + esc(f.materialPlaca) + '</td><td>' + esc(f.tapacantoPrincipal) + '</td><td>' + esc(f.tapacantoSecundario) + '</td><td class="n">' + f.largo + '</td><td class="n">' + f.ancho + '</td><td class="n">' + f.espesor + '</td><td class="n">' + f.cantidad + '</td><td class="n">' + f.arr + '</td><td class="n">' + f.ab + '</td><td class="n">' + f.izq + '</td><td class="n">' + f.der + '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="vacio">Ninguna pieza va al proveedor. Se cargan en la pestaña “Tapacantos”.</div>';
    h += '</div>';

    // Lista de cortes por material: agrupada por material + espesor
    const grupos = {}, orden = [];
    R.corte.forEach(p => {
      const kg = (p.material || '(sin material)') + '||' + (p.espesor || '');
      if (!grupos[kg]) { grupos[kg] = { material: p.material || '(sin material)', espesor: p.espesor, filas: {}, orden: [] }; orden.push(kg); }
      const g = grupos[kg], kf = [p.largo, p.ancho, p.tapLargo, p.tapAncho].join('|');
      if (!g.filas[kf]) { g.filas[kf] = { largo: p.largo, ancho: p.ancho, tapLargo: p.tapLargo, tapAncho: p.tapAncho, cantidad: 0 }; g.orden.push(kf); }
      g.filas[kf].cantidad += num(p.cantidad);
    });
    h += '<div class="card" id="card-cortes"><div class="barra"><h2>Lista de cortes por material</h2><button class="no-print" data-acc="print-sec" data-target="card-cortes">🖨 Imprimir</button></div>' +
      '<p class="hint no-print">Agrupada por material y espesor; las piezas con la misma medida y el mismo tapacanto se suman en una sola fila, porque para cortar sirve el total, no de qué módulo salió cada pieza.</p>' + titlebar('LISTA DE CORTES POR MATERIAL');
    h += orden.length ? orden.map(k => {
      const g = grupos[k];
      return '<div class="jony-grupo"><div class="jony-grupo-titulo">' + esc(g.material + (g.espesor ? ' · ' + g.espesor + ' mm' : '')) + '</div><div class="tabla-wrap"><table class="tabla-corte"><thead><tr><th>Largo</th><th>Ancho</th><th>Cant.</th><th>TC Largo</th><th>TC Ancho</th></tr></thead><tbody>' +
        g.orden.map(kf => { const f = g.filas[kf]; return '<tr><td class="n">' + f.largo + '</td><td class="n">' + f.ancho + '</td><td class="n">' + f.cantidad + '</td><td class="n">' + f.tapLargo + '</td><td class="n">' + f.tapAncho + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    }).join('') : '<div class="vacio">Todavía no hay datos.</div>';
    return h + '</div>';
  }

  /* ---- Listas ---- */
  function vistaListas() {
    const L = D.listas;
    const filasAmb = (L.ambientes || []).map((a, i) => '<tr><td><input data-k="amb:' + i + ':nombre" value="' + esc(a.nombre) + '"></td><td><input data-k="amb:' + i + ':codigo" value="' + esc(a.codigo) + '" style="width:90px"></td><td class="acc"><button class="peligro ico" data-acc="amb-del" data-i="' + i + '">✕</button></td></tr>').join('');
    return '<div class="card"><h2>Ambientes y códigos</h2><p class="hint">El código forma el ID del módulo (ej. 01Coc). Cambiar un código no renombra IDs ya creados.</p><div class="tabla-wrap"><table class="t" style="max-width:520px"><thead><tr><th>Ambiente</th><th>Código</th><th></th></tr></thead><tbody>' + filasAmb + '</tbody></table></div><button class="sec mini" data-acc="amb-add" style="margin-top:8px">+ Ambiente</button></div>' +
      '<div class="grid2">' + listaTexto('materiales', 'Materiales', 'Uno por línea. Aparecen como sugerencias en los campos de material.') + listaTexto('tiposPuerta', 'Tipos de puerta (apertura)', 'Push, Abatible, c·Buña…') + listaTexto('categoriasSueltas', 'Categorías de piezas sueltas', 'Perfil L, Aplicados, Ajustes…') + '</div>' +
      '<div class="card"><button class="sec" data-acc="listas-def">Usar estas listas como predeterminadas para proyectos nuevos</button><p class="hint" style="margin-top:8px">Quedan guardadas en este navegador.</p></div>';
  }
  function listaTexto(k, t, ayuda) {
    return '<div class="card"><h2>' + t + '</h2><p class="hint">' + ayuda + '</p><textarea data-lista="' + k + '" style="min-height:160px">' + esc((D.listas[k] || []).join('\n')) + '</textarea></div>';
  }

  /* ------------------------------------------------------------------ armado general */
  // Pestañas a la vista; las tablas de carga manual viven dentro de “Control manual”.
  const PESTANAS = [['proyecto', 'Proyecto'], ['ficha', 'Fichas'], ['taller', 'Taller'], ['overrides', 'Override'], ['proveedores', 'Proveedores'], ['listas', 'Listas'], ['manual', 'Control manual']];
  const MANUAL = [['modulos', 'Módulos'], ['puertas', 'Puertas'], ['cajones', 'Cajones'], ['sueltas', 'Piezas Sueltas'], ['tapacantos', 'Tapacantos']];
  const esManual = (k) => MANUAL.some(m => m[0] === k);
  function contador(k) { if (k === 'ficha') return D.modulos.length; if (k === 'manual') return null; return TABLAS[k] ? D[TABLAS[k].arr].length : null; }

  // Los avisos del motor son texto: el módulo al que se refieren se saca del propio mensaje.
  function destinoAviso(a) {
    const ids = idsModulos().sort((x, y) => y.length - x.length);
    let id = '';
    for (const c of ids) {
      const re = new RegExp('(^|[^0-9A-Za-zÀ-ÿ])' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^0-9A-Za-zÀ-ÿ])');
      if (re.test(a)) { id = c; break; }
    }
    let t = 'modulos';
    if (/Tapacantos/.test(a)) t = 'tapacantos';
    else if (/Piezas Sueltas/.test(a)) t = 'sueltas';
    else if (/cajon|cajón|Cajón/.test(a) && !/\(Cajonera\): no tiene/.test(a)) t = 'cajones';
    else if (/puerta/i.test(a) && !/no tiene puertas/.test(a)) t = 'puertas';
    if (!id && t === 'modulos') return null;
    return { tab: t, id };
  }
  function resaltarFilas(id) {
    const filas = Array.from(document.querySelectorAll('tr[data-mod]')).filter(tr => tr.dataset.mod === id);
    filas.forEach(tr => tr.classList.add('resaltada'));
    if (filas[0]) filas[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
    setTimeout(() => filas.forEach(tr => tr.classList.remove('resaltada')), 2800);
  }
  function irA(t, id) {
    if (id && moduloPorId(id)) { fichaSel = id; tab = 'ficha'; render(); window.scrollTo(0, 0); return; }
    const T = TABLAS[t];
    if (T && id && !D[T.arr].some(r => String(t === 'modulos' ? r.id : r.idModulo || '').trim() === id)) t = 'modulos';
    tab = t; render(); window.scrollTo(0, 0);
    if (id) setTimeout(() => resaltarFilas(id), 30);
  }
  function avisosHtml() {
    if (!R) return '';
    if (!R.ok) return '<div class="avisos error no-print"><strong>No se pudo generar el despiece:</strong> ' + esc(R.mensaje) + '</div>';
    if (!R.avisos.length) return '';
    return '<details class="avisos no-print"' + (avisosAbierto ? ' open' : '') + '><summary>⚠ ' + R.avisos.length + ' aviso' + (R.avisos.length > 1 ? 's' : '') + '</summary><ul>' + R.avisos.map(a => {
      const d = destinoAviso(a);
      return '<li>' + esc(a) + (d ? ' <a href="#" class="ir" data-ir-tab="' + d.tab + '" data-ir-id="' + esc(d.id) + '">Ir →</a>' : '') + '</li>';
    }).join('') + '</ul></details>';
  }

  function render() {
    const act = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    const nav = PESTANAS.map(([k, t]) => { const n = contador(k); const act = k === tab || (k === 'manual' && esManual(tab)); return '<a data-tab="' + k + '" class="' + (act ? 'activa' : '') + '">' + t + (n ? '<span class="n">' + n + '</span>' : '') + '</a>'; }).join('') +
      '<span style="flex:1"></span><button class="mini" data-acc="etiquetas-pdf" title="Genera y descarga el PDF con una etiqueta por pieza">🏷 Imprimir etiquetas</button>';
    $('#tabs').innerHTML = nav;
    $('#avisos').innerHTML = avisosHtml();
    let html = '';
    if (tab === 'proyecto') html = vistaProyecto();
    else if (tab === 'ficha') html = vistaFicha();
    else if (TABLAS[tab]) html = (esManual(tab) ? subnavManual() : '') + tablaEditable(tab);
    else if (tab === 'taller') html = vistaTallerTab();
    else if (tab === 'proveedores') html = vistaProveedores();
    else if (tab === 'listas') html = vistaListas();
    $('#main').innerHTML = html;
    const dl = $('#dl-mat'); dl.innerHTML = materialesConocidos().map(m => '<option value="' + esc(m) + '">').join('');
    $('#nombreProyecto').textContent = D.proyecto.nombre || '(proyecto sin nombre)';
    if (act) { const el = document.querySelector('[data-k="' + act.replace(/"/g, '') + '"]'); if (el) { el.focus(); try { if (el.setSelectionRange && el.type !== 'number') el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* no aplica */ } } }
    actualizarBotones(); actualizarPie();
  }
  // Pie de página de la impresión (margen inferior de la hoja): proyecto, cuándo se imprimió, cuándo se modificó por última vez y nº de página.
  function textoPie() {
    const ed = D.meta.editado || D.meta.modificado;
    return (D.proyecto.nombre || 'Proyecto sin nombre') + '  ·  Impreso el ' + fechaLarga(new Date().toISOString()) + '  ·  Datos modificados por última vez el ' + (ed ? fechaLarga(ed) : '—');
  }
  function actualizarPie() {
    if (!D) return;
    let st = document.getElementById('pieStyle');
    if (!st) { st = document.createElement('style'); st.id = 'pieStyle'; document.head.appendChild(st); }
    const t = textoPie().replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ');
    st.textContent = '@page { @bottom-left { content: "' + t + '"; font: 8px Arial, sans-serif; color: #444; } @bottom-right { content: "Pág. " counter(page) " de " counter(pages); font: 8px Arial, sans-serif; color: #444; } }';
    st.dataset.texto = textoPie();
  }
  function actualizarBotones() {
    const gh = St.ghListo();
    $('#btnUndo').disabled = !pilaUndo.length; $('#btnRedo').disabled = !pilaRedo.length;
    $('#btnHist').style.display = gh && D.meta.archivo ? '' : 'none';
  }

  /* ------------------------------------------------------------------ cambios */
  function foto() { return JSON.stringify(Object.assign({}, D, { meta: null })); }
  function reiniciarDeshacer() { pilaUndo = []; pilaRedo = []; snapActual = foto(); ultimoCambio = 0; }
  function programarGuardado() {
    sucioRemoto = true;
    setEstado('Guardando…', '');
    clearTimeout(timerGuardado);
    timerGuardado = setTimeout(() => {
      const ok = St.guardarLocal(D);
      setEstado(ok ? 'Guardado en este navegador ' + hora() + (St.ghListo() ? ' · sin subir a GitHub' : '') : 'No se pudo guardar en el navegador — descargá el .json', ok ? (St.ghListo() ? 'warn' : 'ok') : 'err');
    }, 350);
  }
  // forzar = acción estructural (agregar, borrar, crear desde tipo…): siempre es un paso propio de deshacer.
  function tocado(forzar) {
    recalcular();
    const f = foto();
    if (f !== snapActual) {
      const ahora = Date.now();
      if (forzar === true || ahora - ultimoCambio > 900) { pilaUndo.push(snapActual); if (pilaUndo.length > 100) pilaUndo.shift(); }
      ultimoCambio = ahora; snapActual = f; pilaRedo = [];
      D.meta.editado = new Date().toISOString();
    }
    programarGuardado();
    actualizarBotones();
  }
  function aplicarFoto(f) {
    const meta = D.meta; D = JSON.parse(f); D.meta = meta; D.meta.editado = new Date().toISOString();
    snapActual = f; ultimoCambio = 0; recalcular(); programarGuardado(); render();
  }
  function deshacer() { if (!pilaUndo.length) { toast('No hay nada para deshacer'); return; } pilaRedo.push(snapActual); aplicarFoto(pilaUndo.pop()); toast('Deshecho', 'ok'); }
  function rehacer() { if (!pilaRedo.length) { toast('No hay nada para rehacer'); return; } pilaUndo.push(snapActual); aplicarFoto(pilaRedo.pop()); toast('Rehecho', 'ok'); }

  function setVal(tk, i, k, v) {
    if (tk === 'proyecto') { D.proyecto[k] = v; tocado(); if (k === 'nombre') $('#nombreProyecto').textContent = v || '(proyecto sin nombre)'; return; }
    const T = TABLAS[tk]; const row = D[T.arr][i]; if (!row) return;
    const viejo = row[k];
    const idAntes = tk === 'modulos' ? String(row.id).trim() : '';
    row[k] = v;
    if (T.alCambiar) T.alCambiar(row, k, v, viejo);
    if (tk === 'modulos' && fichaSel === idAntes) fichaSel = String(row.id).trim();
    tocado();
    const col = T.cols.find(c => c.k === k);
    if (tk === 'overrides' && k === 'idModulo') row.pieza = '';
    if (tab === 'ficha' || (col && col.rr) || T.alCambiar || tk === 'puertas' || tk === 'tapacantos') setTimeout(render, 0);
    else setTimeout(() => { $('#avisos').innerHTML = avisosHtml(); }, 0);
  }

  function valorDeEl(el, c) {
    if (el.type === 'checkbox') return el.checked;
    if (c && (c.tipo === 'num')) return el.value === '' ? '' : Number(el.value);
    if (c && c.tipo === 'sel' && el.value !== '' && !isNaN(Number(el.value)) && /^(arr|ab|izq|der|tcl|tca|fondo)$/.test(c.k)) return Number(el.value);
    return el.value;
  }

  /* ------------------------------------------------------------------ eventos */
  function eventos() {
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.cut !== undefined) { if (el.checked) D.cortadas[el.dataset.cut] = true; else delete D.cortadas[el.dataset.cut]; tocado(); render(); return; }
      if (el.dataset.oc !== undefined) { ocultarCortadas = el.checked; render(); return; }
      if (el.dataset.busq !== undefined) { busq[el.dataset.busq] = el.value; render(); return; }
      if (el.dataset.agrupar !== undefined) { agruparPor = el.value; subPieza = ''; render(); return; }
      if (el.dataset.subpieza !== undefined) { subPieza = el.value; render(); return; }
      if (el.dataset.lista) { D.listas[el.dataset.lista] = el.value.split('\n').map(s => s.trim()).filter(Boolean); tocado(true); render(); return; }
      const k = el.dataset.k; if (!k) return;
      const p = k.split(':');
      if (p[0] === 'amb') { const a = D.listas.ambientes[Number(p[1])]; if (a) { a[p[2]] = el.value.trim(); tocado(); } return; }
      if (p[0] === 'proyecto') { setVal('proyecto', 0, p[1], el.value); return; }
      const T = TABLAS[p[0]]; const c = T && T.cols.find(x => x.k === p[2]);
      setVal(p[0], Number(p[1]), p[2], valorDeEl(el, c));
    });
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset && el.dataset.busq !== undefined) { busq[el.dataset.busq] = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-busq="' + el.dataset.busq + '"]'); if (n) { n.focus(); } return; }
      if (el.classList && el.classList.contains('cat')) mostrarSugerencias(el);
    });
    document.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('cat')) mostrarSugerencias(e.target); });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sugerencias') && !(e.target.classList && e.target.classList.contains('cat'))) cerrarSugerencias();
      const ir = e.target.closest('[data-ir-tab]'); if (ir) { e.preventDefault(); irA(ir.dataset.irTab, ir.dataset.irId); return; }
      const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab === 'manual' ? ultimoManual : t.dataset.tab; render(); window.scrollTo(0, 0); return; }
      const fm = e.target.closest('[data-ficha]'); if (fm) { fichaSel = fm.dataset.ficha; render(); return; }
      const b = e.target.closest('[data-acc]'); if (!b) return;
      e.preventDefault();
      accion(b.dataset.acc, b.dataset.i !== undefined ? Number(b.dataset.i) : null, b);
    });
    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); guardar(); return; }
      // Dentro de un campo, Ctrl+Z deshace el texto de ese campo; fuera de un campo, deshace el último cambio del proyecto.
      const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if (enCampo || document.querySelector('dialog[open]')) return;
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); deshacer(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); rehacer(); }
    });
    document.addEventListener('toggle', (e) => { if (e.target.matches && e.target.matches('details.avisos')) avisosAbierto = e.target.open; }, true);
    window.addEventListener('beforeprint', actualizarPie);
    window.addEventListener('beforeunload', (e) => { if (sucioRemoto && St.ghListo()) { e.preventDefault(); e.returnValue = ''; } });
  }

  async function accion(a, i, btn) {
    const T = TABLAS[tab];
    if (a === 'cut-mod') {
      const id = btn.dataset.id, ps = piezasTaller().filter(x => x.id === id);
      const todas = ps.every(x => estaCortada(x.id, x.p));
      ps.forEach(x => { const k = claveCorte(x.id, x.p); if (todas) delete D.cortadas[k]; else D.cortadas[k] = true; });
      tocado(true); render(); return;
    }
    if (a === 'cut-clear') { if (await confirmar('¿Sacar la marca de “cortada” a todas las piezas?', 'Limpiar marcas')) { D.cortadas = {}; tocado(true); render(); } return; }
    if (a === 'tipo-nuevo') { dialogoTipo(); return; }
    if (a === 'f-nuevo') {
      const sel = moduloPorId(fichaSel), amb = sel ? sel.ambiente : '';
      const m = TABLAS.modulos.nuevo(); if (amb) { m.ambiente = amb; m.id = M.siguienteId(D.modulos, amb, codigoAmbiente(amb), null); }
      D.modulos.push(m); fichaSel = String(m.id).trim(); tocado(true); render(); return;
    }
    if (a === 'f-duplicar') {
      const n = await pedirTexto('¿Cuántas copias de ' + fichaSel + '? (con todas sus puertas, cajones y piezas)', '1', 'Duplicar');
      const c = Math.floor(num(n)); if (!n) return;
      if (!(c >= 1 && c <= 50)) { toast('Poné un número entre 1 y 50.', 'err'); return; }
      const nuevos = duplicarModulo(fichaSel, c); if (nuevos.length) fichaSel = nuevos[0];
      tocado(true); render(); toast('Se crearon: ' + nuevos.join(', '), 'ok'); return;
    }
    if (a === 'f-borrar-mod') {
      const i0 = D.modulos.findIndex(m => String(m.id).trim() === fichaSel); if (i0 < 0) return;
      const row = D.modulos[i0];
      if (!(await TABLAS.modulos.alBorrar(row))) return;
      D.modulos.splice(i0, 1); TABLAS.modulos.despuesBorrar(row);
      const prox = D.modulos[Math.min(i0, D.modulos.length - 1)]; fichaSel = prox ? String(prox.id).trim() : '';
      tocado(true); render(); return;
    }
    if (a === 'f-tipo-guardar') { await guardarComoTipo(D.modulos.findIndex(m => String(m.id).trim() === fichaSel)); return; }
    if (a === 'f-add' || a === 'f-dup' || a === 'f-del') {
      const tk = btn.dataset.t, TT = TABLAS[tk];
      if (a === 'f-add') { const r = TT.nuevo(); r.idModulo = fichaSel; D[TT.arr].push(r); }
      else if (a === 'f-dup') { const r = D[TT.arr][i]; D[TT.arr].splice(i + 1, 0, JSON.parse(JSON.stringify(r))); }
      else D[TT.arr].splice(i, 1);
      tocado(true); render(); return;
    }
    if (a === 'tipo-guardar') { await guardarComoTipo(i); return; }
    if (a === 'add' && T) { D[T.arr].push(T.nuevo()); tocado(true); render(); const f = document.querySelector('tbody tr:last-child input, tbody tr:last-child select'); if (f) f.focus(); return; }
    if (a === 'dup' && T) { const row = D[T.arr][i]; const c = T.duplicar ? T.duplicar(row) : JSON.parse(JSON.stringify(row)); D[T.arr].splice(i + 1, 0, c); tocado(true); render(); return; }
    if (a === 'del' && T) {
      const row = D[T.arr][i];
      if (T.alBorrar && !(await T.alBorrar(row))) return;
      D[T.arr].splice(i, 1); if (T.despuesBorrar) T.despuesBorrar(row);
      tocado(true); render(); return;
    }
    if (a === 'clear' && T) {
      if (!(await confirmar('¿Borrar las ' + D[T.arr].length + ' filas de “' + T.titulo + '”?', 'Borrar todo'))) return;
      if (tab === 'modulos') { ['puertas', 'cajones', 'overrides', 'tapacantos'].forEach(k => D[k] = []); D.sueltas = D.sueltas.filter(s => !String(s.idModulo).trim()); }
      D[T.arr] = []; tocado(true); render(); return;
    }
    if (a === 'print') { window.print(); return; }
    if (a === 'print-sec') { imprimirSeccion(document.getElementById(btn.dataset.target)); return; }
    if (a === 'etiquetas-pdf') { await imprimirEtiquetas(); return; }
    if (a === 'limpiar-busq') { busq = { largo: '', ancho: '', espesor: '' }; render(); return; }
    if (a === 'amb-add') { D.listas.ambientes.push({ nombre: '', codigo: '' }); tocado(true); render(); return; }
    if (a === 'amb-del') { D.listas.ambientes.splice(i, 1); tocado(true); render(); return; }
    if (a === 'listas-def') { St.guardarListasPorDefecto(D.listas); toast('Listas guardadas como predeterminadas', 'ok'); return; }
    if (a === 'prov-csv') { exportarProveedorCSV(); return; }
    if (a === 'prov-json') { St.descargar(St.slug(D.proyecto.nombre) + '-proveedor.json', JSON.stringify(R.proveedor, null, 2)); return; }
    if (a === 'cat-file') { elegirArchivo('.json', async (txt) => { try { const items = St.normalizarCatalogo(JSON.parse(txt)); await St.catalogoGuardar(items); toast('Catálogo cargado: ' + items.length + ' ítems', 'ok'); render(); } catch (err) { toast(err.message, 'err'); } }); return; }
    if (a === 'cat-gh') { try { const items = await St.ghTraerCatalogo(); await St.catalogoGuardar(items); toast('Catálogo traído de GitHub: ' + items.length + ' ítems', 'ok'); render(); } catch (err) { toast('No pude traer el catálogo: ' + err.message, 'err'); } return; }
  }

  // Imprime sólo una sección de la pantalla (el resto se oculta mientras dura la impresión).
  function imprimirSeccion(el) {
    if (!el) { window.print(); return; }
    document.body.classList.add('solo-impresion'); el.classList.add('imprimir-esto');
    const fin = () => { document.body.classList.remove('solo-impresion'); el.classList.remove('imprimir-esto'); window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    window.print();
  }
  function exportarProveedorCSV() {
    const cols = ['ID Módulo', 'Pieza', 'Material', 'Material Placa', 'Tapacanto Principal', 'Tapacanto Secundario', 'Largo', 'Ancho', 'Espesor', 'Cantidad', 'Arr.', 'Ab.', 'Izq.', 'Der.'];
    const q = (v) => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
    const filas = R.proveedor.map(f => [f.idModulo, f.pieza, f.material, f.materialPlaca, f.tapacantoPrincipal, f.tapacantoSecundario, f.largo, f.ancho, f.espesor, f.cantidad, f.arr, f.ab, f.izq, f.der].map(q).join(';'));
    St.descargar(St.slug(D.proyecto.nombre) + '-proveedor.csv', '﻿' + [cols.map(q).join(';')].concat(filas).join('\r\n'), 'text/csv;charset=utf-8');
  }
  function elegirArchivo(accept, cb) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.style.display = 'none';
    inp.addEventListener('change', () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(String(r.result), f); r.readAsText(f); inp.remove(); });
    document.body.appendChild(inp); inp.click();
  }

  /* ---- sugerencias del catálogo ---- */
  let sugEl = null, sugInput = null;
  function cerrarSugerencias() { if (sugEl) { sugEl.remove(); sugEl = null; sugInput = null; } }
  function mostrarSugerencias(inp) {
    const tipo = Number(inp.dataset.cat);
    if (!St.catalogo.length) { cerrarSugerencias(); return; }
    let q = inp.value;
    // Si el campo está vacío, sugerir según el material que el despiece ya le asignó a la pieza.
    if (!q && tipo === 0) {
      const [tk, i] = inp.dataset.k.split(':'); const row = D[TABLAS[tk].arr][Number(i)];
      if (row && row.pieza && R && R.ok) {
        const clave = (String(row.idModulo).trim() + '|' + row.pieza).toLowerCase();
        const f = R.corte.concat(R.proveedor).find(x => (String(x.idModulo).trim() + '|' + String(x.pieza).trim()).toLowerCase() === clave);
        if (f && f.material) q = f.material;
      }
    }

  async function guardar() {

  /* ---- Módulos tipo ---- */
  function describirTipo(t) {
    const pu = (t.puertas || []).map(x => x.cant + ' ' + (x.corte || '?') + (x.modalidad === 'Simetrica' ? ' simétrica' : '')).join(' + ');
    return [t.modulo.tipo, pu || 'sin puertas', (t.cajones || []).length ? (t.cajones.length + ' cajón(es)') : ''].filter(Boolean).join(' · ');
  }

      '<div class="campo"><label class="l">H (alto)</label><input id="tpH" type="number" inputmode="decimal"></div>' +
      '<div class="campo"><label class="l">P (profundidad)</label><input id="tpP" type="number" inputmode="decimal"></div></div>' +
      '<div class="pie-d" style="justify-content:space-between"><button class="peligro mini" data-r="del">Borrar esta plantilla</button><div style="display:flex;gap:8px"><button class="sec" data-r="x">Cancelar</button><button data-r="ok">Crear</button></div></div>');

  async function guardarComoTipo(i) {
    const m = D.modulos[i]; if (!m) return;
    const id = String(m.id).trim();
    const nombre = await pedirTexto('Nombre del módulo tipo', [m.tipo, ''].join(' ').trim(), 'Guardar');
    if (!nombre) return;
    const mL = num(m.l), rel = (v) => (v === '' || v === undefined || v === null || !(mL > 0)) ? '' : Number(v) - mL;
    const tipo = {
      nombre,
      modulo: { tipo: m.tipo, h: m.h, l: m.l, p: m.p, material: m.material || '', eMovil: m.eMovil || 0, eFijo: m.eFijo || 0, pteExtra: m.pteExtra || 0, fondo: m.fondo !== false, observaciones: m.observaciones || '' },
      puertas: D.puertas.filter(r => String(r.idModulo).trim() === id).map(r => { const c = JSON.parse(JSON.stringify(r)); delete c.idModulo; return c; }),
      cajones: D.cajones.filter(r => String(r.idModulo).trim() === id).map(r => ({ h: r.h, dl: rel(r.l), p: r.p, fondo: r.fondo, dlPlaca: rel(r.lPlaca), aPlaca: r.aPlaca })),
    };
    const lista = D.listas.modulosTipo || (D.listas.modulosTipo = []);
    const ya = lista.findIndex(t => t.nombre.toLowerCase() === nombre.toLowerCase());
    if (ya >= 0) { if (!(await confirmar('Ya existe una plantilla llamada “' + lista[ya].nombre + '”. ¿La reemplazo?', 'Reemplazar'))) return; lista[ya] = tipo; } else lista.push(tipo);
    tocado(true);
    toast('Guardado como módulo tipo “' + nombre + '”. Para tenerlo en proyectos nuevos: Listas → “Usar estas listas como predeterminadas”.', 'ok');
  }

  /* ---- Comparar versiones ---- */
  function dialogoCambios(titulo, viejo, nuevo, aclaracion) {
    const cambios = window.Diff.comparar(viejo, nuevo, TABLAS);
    let resumen = '';
    try {
      const a = M.generar(viejo), b = M.generar(nuevo);
      if (a.ok && b.ok) {
        const sum = (l) => l.reduce((s, f) => s + num(f.cantidad), 0);
        const lin = [['Piezas a cortar en taller', sum(a.corte), sum(b.corte)], ['Piezas a proveedor', sum(a.proveedor), sum(b.proveedor)]].filter(x => x[1] !== x[2]);
        if (lin.length) resumen = '<div class="hint" style="margin:0 0 10px">' + lin.map(x => esc(x[0]) + ': <strong>' + x[1] + ' → ' + x[2] + '</strong>').join(' &nbsp;·&nbsp; ') + '</div>';
      }
    } catch (e) { /* el resumen es opcional */ }
    const ico = { '+': '<span style="color:var(--ok)">＋</span>', '-': '<span style="color:var(--err)">－</span>', '~': '<span style="color:var(--warn)">≠</span>' };
    const cuerpo = cambios.length ? cambios.map(c => '<div class="fila" style="justify-content:flex-start;gap:10px;padding:6px 12px">' + ico[c.tipo] + '<span style="font-size:12.5px">' + esc(c.texto) + '</span></div>').join('') : '<div class="vacio">No hay diferencias en los datos.</div>';
    dialogo('<h3>' + esc(titulo) + '</h3><p class="hint" style="margin-top:0">' + esc(aclaracion) + '</p>' + resumen + '<div style="max-height:55vh;overflow-y:auto">' + cuerpo + '</div><div class="pie-d"><button class="sec" data-r="x" onclick="this.closest(\'dialog\').close()">Cerrar</button></div>');
  }

  /* ------------------------------------------------------------------ arranque */
  async function iniciar() {
    // Enlace de configuración (#cfg=…): deja GitHub conectado y borra el token de la barra de direcciones.
    const cfgLink = St.configDeHash(location.hash);
    let avisoCfg = '';
    if (cfgLink) {
      St.ghGuardarConfig(cfgLink);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
      avisoCfg = 'GitHub quedó conectado (' + cfgLink.owner + '/' + cfgLink.repo + ').';
    }
    await St.catalogoCargarLocal();
    St.catalogoAutomatico().then((o) => { catalogoOrigen = o; if (D) render(); });
    eventos();
    $('#btnUndo').onclick = deshacer; $('#btnRedo').onclick = rehacer;
    $('#btnProy').onclick = dialogoProyectos;
    $('#btnGuardar').onclick = guardar;
    $('#btnJson').onclick = () => St.descargar(St.slug(D.proyecto.nombre) + '.json', St.serializar(D));
    $('#btnHist').onclick = dialogoHistorial;
    $('#btnCfg').onclick = dialogoGithub;
    let d = null;
    const ult = St.ultimoId();
    if (ult) { try { d = St.cargarLocal(ult); } catch (e) { d = null; } }
    if (!d) d = St.nuevoProyecto('');
    D = d; recalcular(); reiniciarDeshacer(); render();
    if (!St.localDisponible()) setEstado('Este navegador no permite guardar localmente: descargá el .json seguido', 'warn');
    else setEstado(D.proyecto.nombre ? 'Proyecto abierto' : 'Proyecto nuevo', '');
    if (avisoCfg) { toast(avisoCfg, 'ok'); setEstado(avisoCfg, 'ok'); }
    // Pruebas automáticas / depuración
    window.__app = { get D() { return D; }, get R() { return R; }, recalcular, render, abrir, setTab: (t) => { tab = t; render(); } };
  }
  document.addEventListener('DOMContentLoaded', iniciar);
})();

</script>
</body>
</html>
